 --tx:#fff;--mut:#fff;--grass:#00e05a;--grassd:#00e05a;--gold:#ffd400;--gold-d:#ffd400;--on-gold:#000;
 --cry:#00e5ff;--red:#ff8a8a;--ok:#00ff85;--okbg:#000;--okd:#00ff85;--soft:#000;--soft-tx:#fff;--soft-edge:#fff;
 --ib:#ffffff;--focus:#00e5ff;--sel:#ffd400;--star:#ffd400;--star-off:#666;--blue:#00e5ff;--link:#00e5ff;
}
*{box-sizing:border-box}
html{font-size:calc(100%*var(--fs));-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:1.0625rem;line-height:1.55;min-height:100vh;
 background-image:linear-gradient(var(--bg2) 50%,transparent 50%),linear-gradient(90deg,var(--bg2) 50%,transparent 50%);background-size:32px 32px;background-attachment:fixed}
html[data-theme="contrast"] body{background-image:none}
h1,h2,h3{font-family:var(--font);line-height:1.2;margin:0;font-weight:700}
h1,.logo{font-family:var(--head)}
h1,h2,h3,.btn,.logo,.tag{font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0,"calt" 0}
h1{font-size:1.7rem}h2{font-size:1.3rem}h3{font-size:1.1rem}
p{margin:0 0 .75rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
a{color:var(--link)}
.skip{position:absolute;left:.5rem;top:-4rem;background:var(--gold);color:var(--on-gold);padding:.7rem 1rem;border:4px solid var(--edge);font-weight:700;z-index:100;text-decoration:none}
.skip:focus{top:.5rem}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
[hidden]{display:none!important}
.px{display:block;flex:none;image-rendering:pixelated}
.inl{display:inline-block;vertical-align:-.2em}
/* barre du haut */
.top{position:sticky;top:0;z-index:20;background:var(--pan);border-bottom:4px solid var(--edge);display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.4rem .75rem}
.logo{display:flex;align-items:center;gap:.5rem;font-family:var(--head);font-weight:700;font-size:1.25rem;letter-spacing:.02em}
.logo b{color:var(--gold)}
html[data-theme="day"] .logo b{color:#8a5a00}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--pan2);border:3px solid var(--edge);padding:.15rem .6rem;min-height:2.75rem;font-weight:700}
main{max-width:46rem;margin:0 auto;padding:1rem .85rem 7.5rem}
/* barre d'inventaire */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--pan);border-top:4px solid var(--edge);display:flex;justify-content:center;padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom))}
.tabs ul{display:flex;list-style:none;margin:0;padding:0;width:100%;max-width:46rem;gap:.3rem}
.tabs li{flex:1;min-width:0}
.tab{width:100%;min-height:3.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;background:var(--pan2);border:3px solid var(--edge);color:var(--mut);font-size:.78rem;font-weight:700;cursor:pointer;padding:.2rem .1rem;box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}
.tab[aria-current="page"]{background:var(--pan);border-color:var(--sel);color:var(--tx);box-shadow:0 0 0 3px var(--sel)}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.25rem;min-width:3rem;padding:.55rem 1.1rem;border:4px solid var(--edge);background:var(--grass);color:#07210a;font-family:var(--font);font-weight:700;font-size:1.1rem;cursor:pointer;text-decoration:none;text-align:center;box-shadow:inset 4px 4px 0 rgba(255,255,255,.35),inset -4px -4px 0 rgba(0,0,0,.28)}
html[data-theme="contrast"] .btn{color:#000}

.btn:active{transform:translateY(3px)}
.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:var(--pan2);color:var(--tx);box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}
.btn.small{min-height:2.75rem;padding:.3rem .8rem;font-size:1rem}
.btn.block{display:flex;width:100%}
.btn[aria-disabled="true"]{opacity:.55}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.card{background:var(--pan);border:4px solid var(--edge);padding:1rem;box-shadow:inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--lo)}
.card+.card{margin-top:.8rem}
.muted{color:var(--mut)}
.notice{background:var(--pan2);border:4px solid var(--gold);padding:.6rem .9rem;margin-bottom:1rem}
/* accueil */
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.8rem;margin:.4rem 0 1rem}
.bubble{position:relative;min-width:min(100%,12rem);background:var(--pan);border:4px solid var(--edge);padding:.6rem .9rem;flex:1;box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}
.daily{border-color:var(--gold)}
.rank{display:grid;gap:.5rem}
.rank .top2{display:flex;align-items:center;gap:.7rem}
.rank .rn{font-family:var(--head);font-size:1.3rem}
.bar{height:1.2rem;background:var(--bg);border:3px solid var(--edge);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grass);background-image:linear-gradient(90deg,transparent 80%,rgba(0,0,0,.25) 80%);background-size:12px 100%}
.worlds{margin:1.2rem 0 .4rem}
/* biomes et stations */
.biome{margin-top:1.4rem;--bc:#5fae3e;--bd:#2f6f1e;--bt:#0e1a08}
.biome[data-b="lec"]{--bc:#6cc24a;--bd:#2f6f1e;--bt:#0b1a07}
.biome[data-b="mot"]{--bc:#2f7d4a;--bd:#16422a;--bt:#ffffff}
.biome[data-b="phr"]{--bc:#9ba0ae;--bd:#575c69;--bt:#0e1014}
.biome[data-b="acc"]{--bc:#e0c168;--bd:#8d7226;--bt:#241b04}
.biome[data-b="ver"]{--bc:#b8431f;--bd:#6e220c;--bt:#ffffff}
.biome[data-b="voc"]{--bc:#2f74c2;--bd:#173f73;--bt:#ffffff}
.biome[data-b="ecr"]{--bc:#d5ecf6;--bd:#85aebf;--bt:#0a1a22}
.biome>header{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem}
.emblem{display:grid;place-items:center;width:3.4rem;height:3.4rem;flex:none;background:var(--bc);border:4px solid var(--edge);box-shadow:inset 3px 3px 0 rgba(255,255,255,.4),inset -3px -3px 0 rgba(0,0,0,.3)}
.biome ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:.55rem}
.st{display:flex;align-items:center;gap:.75rem;width:100%;text-align:left;background:var(--pan);border:4px solid var(--edge);padding:.55rem .7rem;min-height:4.2rem;cursor:pointer;color:var(--tx);box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}
.st:hover{border-color:var(--gold)}
.st .n{flex:none;width:2.7rem;height:2.7rem;background:var(--bc);color:var(--bt);border:3px solid var(--edge);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:1.2rem;box-shadow:inset 3px 3px 0 rgba(255,255,255,.4),inset -3px -3px 0 rgba(0,0,0,.3)}
.st .t{flex:1;min-width:0;overflow-wrap:anywhere}
.st .t b{display:block;font-size:1.05rem}

.gems{display:flex;align-items:center;gap:.6rem;font-family:var(--head);font-size:2rem;font-weight:700}

.rung{display:grid;grid-template-columns:auto 1fr;gap:.75rem;align-items:center;background:var(--pan);border:4px solid var(--edge);padding:.6rem .75rem;box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}

.rung .mat{font-size:.82rem;color:var(--mut)}
.rung .bar{margin:.35rem 0 .2rem;height:.9rem}
/* séance */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.lesson .wrap{max-width:46rem;margin:0 auto;padding:.75rem .85rem 3rem}
.lhead{display:flex;align-items:center;gap:.6rem;justify-content:space-between;margin-bottom:.6rem;flex-wrap:wrap}
.lhead h1{font-size:1.2rem}
.prog{display:flex;gap:.2rem;margin:.2rem 0 .9rem}
.prog i{flex:1;height:.8rem;background:var(--pan2);border:2px solid var(--edge)}
.prog i.d{background:var(--grass)}
.prog i.c{outline:3px solid var(--tx);outline-offset:1px;background:var(--gold)}
.qcard{background:var(--pan);border:4px solid var(--edge);padding:1rem;box-shadow:inset 4px 4px 0 var(--hi),inset -4px -4px 0 var(--lo)}
.pips{display:inline-flex;align-items:center;gap:.35rem;font-size:.85rem;color:var(--mut);margin:0 0 .5rem}
.pips i{display:inline-block;width:.9rem;height:.9rem;background:var(--gold);border:2px solid var(--edge)}
.pips i.u{background:var(--pan2)}
.passage{background:var(--pan2);border:3px solid var(--edge);padding:.8rem 1rem;margin:0 0 1rem;overflow-wrap:anywhere}
.passage h2{margin-bottom:.4rem}
.passage p{margin:0 0 .6rem;font-size:1.1rem;line-height:1.7}
.lead{font-size:1.2rem;font-weight:700;margin:0 0 .6rem;outline:none;overflow-wrap:anywhere;font-family:var(--font)}
.sub{color:var(--mut);margin:0 0 .6rem}
.ctx{font-size:1.4rem;font-weight:700;background:var(--pan2);border:3px solid var(--edge);padding:.7rem 1rem;margin:0 0 1rem;overflow-wrap:anywhere;line-height:1.7}
.ctx mark{background:var(--gold);color:var(--on-gold);padding:0 .25rem}
.gap{display:inline-block;min-width:3.5rem;border-bottom:5px solid var(--sel);vertical-align:baseline;text-align:center;margin:0 .15rem;color:var(--sel)}
.gap.f{border-bottom-color:var(--ok);color:var(--ok)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.opts{display:grid;gap:.6rem}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:100%;height:100%;inset:0;margin:0;cursor:pointer}
.opt>span{display:flex;align-items:center;gap:.7rem;min-height:3.5rem;padding:.55rem 1rem;border:4px solid var(--edge);background:var(--pan2);font-size:1.15rem;font-weight:700;overflow-wrap:break-word;min-width:0;flex-wrap:wrap;box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}
.opt>span::before{content:"";flex:none;width:1.3rem;height:1.3rem;border:3px solid var(--mut);background:transparent}
.opt input:checked+span{border-color:var(--sel);background:var(--pan);box-shadow:0 0 0 3px var(--sel)}
.opt input:checked+span::before{background:var(--sel);border-color:var(--sel);box-shadow:inset 0 0 0 3px var(--pan)}
.opt input:focus-visible+span{outline:4px solid var(--focus);outline-offset:3px}
.opt input:disabled{cursor:not-allowed}
.opt input:disabled+span{opacity:.78;border-style:dashed;box-shadow:none}
.opt.good input:disabled+span{opacity:1}
.opt.out>span{text-decoration:line-through;text-decoration-thickness:3px}
.opt.good>span{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}.opt .mk::before{display:none}
.opt .mk{margin-left:auto;font-size:.9rem;font-weight:700;white-space:normal;flex:1 0 auto;text-align:right}
.opt.out .mk{text-decoration:none}
.chips2{display:flex;flex-wrap:wrap;gap:.5rem}
.chip2{position:relative}
.chip2 input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip2 span{display:inline-flex;align-items:center;justify-content:center;min-width:3rem;min-height:3.25rem;padding:.4rem .9rem;border:4px solid var(--edge);background:var(--pan2);font-size:1.25rem;font-weight:700;box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}
.chip2 input:checked+span{border-color:var(--sel);box-shadow:0 0 0 3px var(--sel);background:var(--pan)}
.chip2 input:focus-visible+span{outline:4px solid var(--focus);outline-offset:3px}
.chip2 .mk{font-size:.75rem;margin-left:.4rem;text-decoration:none}
.chip2 input:disabled+span{opacity:.78;border-style:dashed;box-shadow:none}
.chip2.out span{text-decoration:line-through;text-decoration-thickness:3px}
.chip2.good input:disabled+span{opacity:1}
.chip2.good span{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.tiles{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0 1rem}
.tile{min-width:3.1rem;min-height:3.25rem;padding:.4rem .9rem;border:4px solid var(--edge);background:var(--pan2);color:var(--tx);font-size:1.25rem;font-weight:700;cursor:pointer;overflow-wrap:anywhere;text-align:left;box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}
.tile.long{flex:1 1 100%;font-size:1.05rem;font-weight:600}
.tile[aria-disabled="true"]{opacity:.35;border-style:dashed;box-shadow:none}
.answerline{min-height:3.75rem;border:4px dashed var(--sel);padding:.5rem .7rem;margin:.4rem 0 .8rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;list-style:none}
.answerline li{background:var(--pan);border:3px solid var(--edge);padding:.2rem .7rem;font-size:1.25rem;font-weight:700;overflow-wrap:anywhere}
.answerline li.lk{border-color:var(--gold)}
.answerline.long{flex-direction:column;align-items:stretch}
.answerline.long li{font-size:1.05rem;font-weight:600}
.answerline .ph{color:var(--mut);font-weight:400;font-size:1rem;background:none;border:0}
.fb{padding:.8rem 1rem;margin:1rem 0 0;display:flex;gap:.8rem;align-items:flex-start;border:4px solid var(--edge)}
.fb .px{margin-top:.15rem}
.fb.good{background:var(--okbg);border-color:var(--ok)}
.fb.soft{background:var(--soft);color:var(--soft-tx);border-color:var(--soft-edge)}
.fb b{display:block;font-size:1.12rem}
.fb p{margin:.25rem 0 0}
.hintbox{background:var(--pan2);border:4px dashed var(--gold);padding:.6rem .9rem;margin:.6rem 0;display:flex;gap:.7rem;align-items:flex-start}
.hintbox p{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem;align-items:center}
.qcard .actions{position:sticky;bottom:0;z-index:3;background:var(--pan);padding:.6rem 0 calc(.5rem + env(safe-area-inset-bottom));margin-bottom:-.5rem;border-top:3px solid var(--pan2)}

.stars-big{display:flex;justify-content:center;gap:.5rem;margin:.6rem 0}
.center{text-align:center}
.center .px{margin:0 auto}
.review li{margin-bottom:.6rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}
caption{text-align:left;font-weight:700;padding:.3rem 0;font-size:1.05rem}
th,td{border-bottom:2px solid var(--hi);padding:.4rem .35rem;text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{color:var(--mut);font-size:.85rem}
.tablewrap{overflow-x:auto}
.tablewrap table{min-width:30rem}
.field{display:grid;gap:.3rem;margin-bottom:.9rem}
.field label,.field .lbl{font-weight:700}
input[type=text],input[type=number],input[type=password],input[type=email],select{min-height:3rem;border:4px solid var(--ib);background:var(--bg);color:var(--tx);padding:.4rem .7rem;width:100%;max-width:24rem}
.txt{min-height:3rem}
.seg{display:flex;flex-wrap:wrap;gap:.5rem}

.seg span{display:inline-flex;align-items:center;min-height:3rem;padding:.3rem 1rem;border:4px solid var(--edge);background:var(--pan2);font-weight:700;box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--lo)}

.auth{min-height:80vh;display:grid;place-items:center;padding:1rem 0}

 {id:'t1',t:'Le chat de Nina',p:['Nina a un petit chat gris. Il s’appelle Pilou. Chaque matin, Pilou miaule devant la porte de la cuisine. Nina lui donne du lait dans un bol bleu. Ensuite, le chat se roule en boule sur le canapé et il s’endort.'],

 {id:'t2',t:'La pluie',p:['Ce matin, il pleut très fort. Tom regarde par la fenêtre. Il voulait aller au parc avec son ballon, mais il doit rester à la maison. Maman sort un jeu de société. Tom sourit et installe les pions sur la table.'],

 {id:'t3',t:'Le goûter d’Inès',p:['Inès rentre de l’école avec sa grand-mère. Elle a très faim. Sur la table, il y a du pain, du chocolat et une poire. Inès choisit le pain avec du chocolat. Elle garde la poire pour plus tard, car elle n’a plus faim après le goûter.'],

     ['Pourquoi garde-t-elle la poire pour plus tard ?','Elle n’a plus faim.','Elle n’aime pas les poires.','La poire est trop dure.','inf','Cherche le mot « car » dans la dernière phrase.']]},
 {id:'t4',t:'Zip sur la Lune',p:['Zip est un petit robot. Il vit sur la Lune avec ses amis. Un soir, il trouve une pierre qui brille. Il la ramasse et la montre à tout le monde. Ses amis disent que c’est un cristal rare. Zip le garde dans sa poche, très fier.'],

     ['Que trouve Zip ?','Une pierre qui brille.','Un autre robot.','Une petite fusée.','lit','Cherche le mot « trouve ».'],
     ['Comment se sent Zip à la fin ?','Il est fier.','Il est triste.','Il est fâché.','inf','Regarde les derniers mots du texte.']]},
 {id:'t5',t:'La course',p:['Aujourd’hui, c’est la course de l’école. Léo court vite, mais il tombe près de la ligne d’arrivée. Sa copine Jade s’arrête et lui tend la main. Ils finissent la course ensemble, tout en bas du classement. Pourtant, ils rient aux éclats.'],
  q:[['Que fait Jade quand Léo tombe ?','Elle s’arrête et l’aide.','Elle court plus vite.','Elle appelle la maîtresse.','lit','Cherche le prénom Jade.'],
     ['Où Léo tombe-t-il ?','Près de la ligne d’arrivée.','Au départ de la course.','Dans la cour.','lit','Relis la deuxième phrase.'],
     ['Léo et Jade gagnent-ils la course ?','Non, ils finissent derniers.','Oui, ils sont premiers.','Oui, ils sont deuxièmes.','inf','Ils sont « tout en bas du classement ».']]},
 {id:'t6',t:'Le jardin de papi',p:['Papi a un grand jardin. Au printemps, il plante des graines de carottes et de radis. Il arrose la terre tous les soirs. Au bout de quelques semaines, de petites feuilles vertes sortent du sol. Papi est impatient de goûter ses premiers légumes.'],
  q:[['Que plante Papi ?','Des graines de carottes et de radis.','Des fleurs rouges.','Des arbres.','lit','Cherche le mot « plante ».'],
     ['Quand arrose-t-il la terre ?','Tous les soirs.','Tous les matins.','Une fois par mois.','lit','Cherche le mot « arrose ».'],
     ['Que sort du sol au bout de quelques semaines ?','De petites feuilles vertes.','Des carottes bien grosses.','Des fleurs jaunes.','lit','Relis l’avant-dernière phrase.']]},
 {id:'t7',t:'Le loup du livre',p:['Maya lit un livre sur un loup gentil. Le loup vit seul dans la forêt. Un jour, un petit lapin perdu frappe à sa porte. Le loup lui prépare une soupe chaude, puis il le ramène chez lui. Maya referme le livre en souriant.'],
  q:[['Qui frappe à la porte du loup ?','Un petit lapin perdu.','Un renard.','Un enfant.','lit','Cherche le mot « frappe ».'],
     ['Que fait le loup, dans l’ordre ?','Il prépare une soupe, puis il ramène le lapin.','Il ramène le lapin, puis il prépare une soupe.','Il referme le livre, puis il prépare une soupe.','chro','Cherche le mot « puis ».'],
     ['Comment est le loup de l’histoire ?','Il est gentil.','Il est méchant.','Il est très gros.','lit','Relis la première phrase.']]},
 {id:'t8',t:'Au marché',p:['Samedi, Papa et Zoé vont au marché. Zoé porte le grand panier. Ils achètent des tomates, du fromage et un melon. Le marchand donne un abricot à Zoé. Elle le mange tout de suite. Il est sucré et juteux.'],
  q:[['Qui porte le grand panier ?','Zoé.','Papa.','Le marchand.','lit','Relis la deuxième phrase.'],
     ['Que donne le marchand à Zoé ?','Un abricot.','Un melon.','Du fromage.','lit','Cherche le mot « marchand ».'],
     ['Zoé aime-t-elle l’abricot ?','Oui, elle le trouve bon.','Non, elle le jette.','Elle ne le goûte pas.','inf','Elle le mange tout de suite. Il est sucré.']]},
 {id:'t9',t:'La nuit étoilée',p:['Ce soir, Hugo dort chez sa tante, à la campagne. Il n’y a pas de lumière dans la rue. Quand il lève la tête, il voit des milliers d’étoiles. Il n’en avait jamais vu autant en ville. Il reste longtemps à la fenêtre, la bouche ouverte.'],
  q:[['Où dort Hugo ?','Chez sa tante, à la campagne.','En ville, chez lui.','Chez ses grands-parents.','lit','Relis la première phrase.'],
     ['Pourquoi voit-il autant d’étoiles ?','Il n’y a pas de lumière dans la rue.','Il a des lunettes.','Il est monté sur le toit.','inf','Relis la deuxième phrase.'],
     ['Que ressent Hugo ?','Il est très étonné et ravi.','Il s’ennuie.','Il a peur du noir.','inf','Il reste longtemps à la fenêtre, la bouche ouverte.']]},
 {id:'t10',t:'Le cadeau',p:['C’est bientôt l’anniversaire de Maman. Nino cherche un cadeau. Il décide de dessiner un grand cœur et d’écrire un mot doux. Il colorie avec ses feutres préférés. Ensuite, il cache le dessin sous son lit. Le jour J, Maman pleure de joie et le serre dans ses bras.'],
  q:[['Que dessine Nino ?','Un grand cœur.','Une maison.','Un chat.','lit','Cherche le mot « dessiner ».'],
     ['Que fait Nino après avoir colorié ?','Il cache le dessin sous son lit.','Il donne le dessin à Maman.','Il jette le dessin.','chro','Cherche le mot « ensuite ».'],
     ['Pourquoi Maman pleure-t-elle ?','Elle est très heureuse.','Elle est triste.','Elle a mal.','inf','Elle pleure « de joie ».']]}

 {id:'g1',t:'La fusée de Léna',p:['Léna rêve de voyager dans l’espace. Chaque soir, elle construit une fusée avec des cartons, du ruban et de la peinture argentée. Son petit frère Yanis l’aide à coller les ailes.','Quand la fusée est prête, ils s’installent dedans avec une lampe de poche. « Trois, deux, un, décollage ! » crie Léna. Yanis ferme les yeux très fort. Il imagine les étoiles qui défilent, puis la Lune toute ronde.','Soudain, Papa ouvre la porte et annonce que le dîner est servi. Les deux enfants soupirent. Le voyage doit s’arrêter, mais Léna promet de repartir demain. Elle colle une étoile jaune sur la porte de la fusée pour ne pas oublier le prochain départ.'],

 {id:'g2',t:'Le hérisson',p:['À la tombée de la nuit, Clara entend un petit bruit dans le jardin. Elle prend sa lampe et s’avance sans faire de bruit. Sous le buisson, une boule de piquants avance doucement. C’est un hérisson !','Clara retient son souffle pour ne pas lui faire peur. L’animal renifle l’herbe, trouve un escargot et le croque avec appétit.','Clara court chercher Papa. Quand ils reviennent, le hérisson a disparu. Papa explique qu’il vient chaque soir chasser des insectes. Alors Clara dépose une soucoupe d’eau près du buisson. Elle espère le revoir demain soir.'],
  q:[['Que découvre Clara sous le buisson ?','Un hérisson.','Un chat.','Un lapin.','lit','Cherche le mot « buisson ».'],

     ['Pourquoi Clara dépose-t-elle une soucoupe d’eau ?','Elle veut aider le hérisson et le revoir.','Elle veut arroser le buisson.','Elle a soif.','inf','Elle espère le revoir demain soir.']]},
 {id:'g3',t:'Le pique-nique',p:['Dimanche, la famille de Malo part en pique-nique au bord d’un lac. Dans le sac, Maman a mis des sandwichs, des fruits et une bouteille de jus d’orange. Malo porte la nappe à carreaux.','Arrivé près de l’eau, il l’étale sur l’herbe. Soudain, le vent se lève et emporte la nappe vers le lac. Malo court derrière elle, glisse sur un caillou et tombe les pieds dans l’eau. Sa petite sœur éclate de rire.','Maman sort une serviette et sèche les chaussures de Malo. Finalement, tout le monde déjeune assis sur des serviettes. Malo trouve que ce pique-nique est le plus drôle de l’été.'],
  q:[['Où la famille de Malo part-elle en pique-nique ?','Au bord d’un lac.','Dans une forêt.','Sur une plage.','lit','Relis la première phrase.'],
     ['Qui porte la nappe à carreaux ?','Malo.','Maman.','Sa petite sœur.','lit','Cherche le mot « nappe ».'],
     ['Qu’est-ce qui emporte la nappe ?','Le vent.','Un chien.','La petite sœur.','lit','Cherche le mot « Soudain ».'],
     ['Pourquoi la petite sœur de Malo rit-elle ?','Parce que Malo tombe dans l’eau.','Parce que Maman raconte une blague.','Parce que le vent est tiède.','inf','Que vient-il de se passer juste avant ?'],
     ['Sur quoi les enfants déjeunent-ils à la fin ?','Sur des serviettes.','Sur la nappe à carreaux.','Sur des chaises.','inf','La nappe est partie vers le lac. Relis la fin.']]},
 {id:'g4',t:'Le nouveau voisin',p:['Un camion de déménagement s’arrête devant la maison d’à côté. Un garçon descend, un grand carton dans les bras. Il s’appelle Samir et il vient d’arriver de Marseille. Il n’a pas l’air très gai.','Ève l’observe depuis sa fenêtre. Elle prend son ballon et traverse la rue. « Tu veux jouer avec moi ? » demande-t-elle. Samir hésite, puis il pose son carton.','Ils passent l’après-midi à jouer au football dans le jardin. Le soir, Samir ne se sent plus seul. Il a déjà une amie dans sa nouvelle rue.'],

 {id:'g5',t:'Le marronnier de l’école',p:['Dans la cour de l’école, il y a un grand marronnier. Au printemps, ses bourgeons s’ouvrent et de belles feuilles vertes apparaissent. En été, l’arbre donne beaucoup d’ombre. Les enfants jouent dessous quand il fait très chaud.','En automne, les feuilles jaunissent, puis tombent sur le sol. On peut aussi ramasser des marrons brillants. En hiver, l’arbre n’a plus de feuilles. Il semble endormi, mais il se prépare à repartir au printemps.'],
  q:[['Où se trouve le marronnier ?','Dans la cour de l’école.','Dans un jardin public.','Devant la mairie.','lit','Relis la première phrase.'],
     ['Que fait l’arbre en été ?','Il donne beaucoup d’ombre.','Il perd ses feuilles.','Il s’ouvre en bourgeons.','lit','Cherche les mots « En été ».'],
     ['Quand peut-on ramasser des marrons ?','En automne.','Au printemps.','En hiver.','lit','Cherche le mot « marrons ».'],
     ['Pourquoi l’arbre semble-t-il endormi en hiver ?','Parce qu’il n’a plus de feuilles.','Parce qu’il fait trop chaud.','Parce que les enfants dorment.','inf','Que n’a-t-il plus en hiver ?'],
     ['Quelle saison vient après l’hiver ?','Le printemps.','L’été.','L’automne.','inf','L’arbre se prépare à repartir…']]},
 {id:'g6',t:'La recette du gâteau au yaourt',p:['Pour préparer un gâteau au yaourt, tu as besoin d’un pot de yaourt, de trois pots de farine, de deux pots de sucre, de trois œufs, d’un demi-pot d’huile et d’un sachet de levure.','D’abord, tu verses le yaourt dans un grand saladier. Ensuite, tu ajoutes les œufs, le sucre et l’huile. Tu mélanges bien. Puis tu verses la farine et la levure petit à petit.','Enfin, un adulte fait cuire le gâteau pendant trente minutes dans un four chaud.'],
  q:[['Combien de pots de farine faut-il ?','Trois pots.','Deux pots.','Un pot.','lit','Relis le premier paragraphe.'],
     ['Que fait-on en premier ?','On verse le yaourt dans un saladier.','On ajoute les œufs.','On verse la farine.','chro','Cherche le mot « D’abord ».'],
     ['Quand verse-t-on la farine ?','Après avoir mélangé les œufs, le sucre et l’huile.','Avant de verser le yaourt.','En même temps que le yaourt.','chro','Cherche le mot « Puis ».'],
     ['Qui fait cuire le gâteau ?','Un adulte.','L’enfant, tout seul.','Le yaourt.','lit','Cherche le mot « Enfin ».'],
     ['À quoi sert ce texte ?','À expliquer comment faire un gâteau.','À raconter une histoire.','À décrire un animal.','inf','Le texte donne une liste puis des étapes.']]}

 {id:"c1",t:"Le jardin de grand-père Marcel",p:[
  "Chaque samedi, Inès rend visite à son grand-père Marcel. Il habite une petite maison au bout du village, entourée d’un grand jardin. Dans le potager, il cultive des tomates, des carottes et des courgettes.",
  "Ce matin, Marcel montre à Inès comment semer des radis. « Il faut faire un petit trou avec le doigt, puis déposer deux graines et les recouvrir de terre », explique-t-il. Inès suit chaque geste avec attention. Elle arrose ensuite la rangée avec un arrosoir en métal.",
  "Dans trois semaines, les radis seront prêts. Inès sourit : elle a déjà hâte de les croquer avec un peu de beurre et de sel. En attendant, Marcel lui promet de lui apprendre à reconnaître les mauvaises herbes."],

  "Jules n’aimait pas beaucoup lire. Les livres de l’école lui semblaient trop longs et les histoires trop calmes. Un mercredi pluvieux, sa tante l’a pourtant emmené à la bibliothèque du quartier.",

 {id:"c3",t:"Le petit phare",p:[
  "Au bord de la mer, il y avait un petit phare tout blanc, avec un toit rouge. Chaque soir, le gardien Armand montait les cent douze marches de l’escalier pour allumer la grande lampe.",
  "Une nuit de tempête, le vent soufflait si fort que les volets claquaient. Armand surveillait l’horizon avec ses jumelles quand il aperçut une minuscule lumière qui tremblait au large. C’était un petit bateau de pêche, perdu au milieu des vagues.",
  "Aussitôt, le gardien fit tourner la lampe plus vite pour que son faisceau balaye la mer. Après de longues minutes, le bateau changea de direction et s’approcha doucement du port. Le lendemain matin, les pêcheurs apportèrent à Armand un panier rempli de poissons pour le remercier."],
  q:[["Combien de marches Armand monte-t-il chaque soir ?","Cent douze.","Cent vingt.","Douze.","lit","Relis la dernière phrase du premier paragraphe."],

     ["Que fait Armand pour aider le bateau ?","Il fait tourner la lampe plus vite.","Il appelle la police par radio.","Il éteint la grande lampe.","chro","Relis le début du dernier paragraphe."],
     ["Pourquoi les pêcheurs apportent-ils des poissons à Armand ?","Pour le remercier de les avoir aidés.","Pour les vendre au marché.","Parce qu’ils ont trop pêché.","inf","Regarde la dernière phrase : le mot « remercier » est écrit."],
     ["Dans le texte, que veut dire « l’horizon » ?","La ligne où la mer semble toucher le ciel.","Le toit rouge du phare.","Le port des pêcheurs.","voc","Armand surveille au loin avec ses jumelles : où regarde-t-il ?"]]},
 {id:"c4",t:"Le match de Camille",p:[

/* ===== Générateurs de questions (purs, sans DOM) ===== */
const NB=' ';
const R={f:Math.random};
const rnd=n=>Math.floor(R.f()*n);
const pick=a=>a[rnd(a.length)];
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const sample=(a,n)=>shuf(a).slice(0,n);
const uniq=a=>[...new Set(a)];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const gq=s=>'«'+NB+s+NB+'»';
const noAcc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const isVow=s=>/^[aeiouyhàâéèêëîïôûAEIOUYH]/.test(s);

/* Fabrique de question */
function Q(o){
  return Object.assign({kind:'choice',lead:'',hint:'',expl:'',tier:1,key:'x',lab:''},o);
}
/* Question à choix : o.ans bonne réponse, o.wrong liste de mauvaises, o.n nombre total d'options */
function CH(o){
  const wr=uniq(o.wrong).filter(x=>x&&x!==o.ans);
  const n=o.n||4;
  if(wr.length<n-1)return null;
  const q=Q(Object.assign({},o,{kind:'choice',ans:o.ans,opts:shuf([o.ans].concat(sample(wr,n-1)))}));
  delete q.wrong;delete q.n;
  return q;
}
function TAP(o){return Q(Object.assign({},o,{kind:'tap'}))}
function BUILD(o){
  let tk=shuf(o.tokens);
  for(let i=0;i<8&&tk.join('\u0001')===o.target.join('\u0001');i++)tk=shuf(o.tokens);
  return Q(Object.assign({},o,{kind:'build',tokens:tk}));
}
const sig=q=>[q.st,q.lead,q.text||'',q.ans&&q.ans.join?q.ans.join(','):q.ans||'',q.target?q.target.join('|'):''].join('§');

/* ---------- L1 : sons et graphies ---------- */
function nearKeys(k){
  const out=[];
  D.sonsProches.forEach(g=>{if(g.includes(k))g.forEach(x=>{if(x!==k&&!out.includes(x))out.push(x)})});
  return out;
}
function wordsOf(keys,n,avoid){
  const pool=[];
  keys.forEach(k=>D.sons[k].w.forEach(w=>{if(!avoid.includes(w))pool.push(w)}));
  return sample(pool,n);
}
function genSon(t){
  const keys=Object.keys(D.sons),k=pick(keys),g=D.sons[k];
  const near=nearKeys(k),far=keys.filter(x=>x!==k&&!near.includes(x));
  const fmt=t===1?'A':pick(['A','B','C']);
  const hint='Dis chaque mot à voix haute et écoute bien sa fin.';
  if(fmt==='C'){
    const three=sample(g.w,3);
    const intr=wordsOf(near.length?near:far,1,g.w)[0];
    return CH({kind:'choice',lead:'Trois de ces mots finissent par le même son. Un mot est différent. Lequel ?',ans:intr,wrong:three,n:4,
      hint,expl:`${cap(intr)} n’a pas le même son final. Les autres finissent tous par le son ${gq(k)}.`,say:'',key:'son:'+k,lab:k,tier:t});
  }
  const ex=pick(g.w),ans=pick(g.w.filter(w=>w!==ex));
  const wrongs=fmt==='A'?wordsOf(far.concat(near),3,g.w):wordsOf(near.length?near:far,3,g.w);
  return CH({lead:`Quel mot finit par le même son que ${gq(ex)} ?`,ans,wrong:wrongs,n:fmt==='A'&&t===1?3:4,
    hint,expl:`${cap(ans)} et ${ex} finissent par le même son : on entend ${gq(k)}.`,say:'',key:'son:'+k,lab:k,tier:t});
}

/* ---------- L2 : lire une phrase ---------- */
function posParse(s){return s.split(' ').map(x=>{const i=x.lastIndexOf(':');return i<0?{w:x,t:null}:{w:x.slice(0,i),t:x.slice(i+1)}})}
function posText(toks){let s='';toks.forEach((x,i)=>{if(x.t===null&&i>0&&/^[.?!]$/.test(x.w))s+=x.w;else s+=(i?' ':'')+x.w});return s}
const HOMOG=new Set(['lit','livre','porte','ferme','tire','compte','marche','joue','danse','saute','chante','pêche','visite','cuisine','coupe','garde','rêve','vole','sort','mène','plie','pousse','montre','trompe','change','file','pose','range','laisse','reste','passe','tourne','court','mange','tombe','jette','sonne','brosse','pleut','pense','bouche','dîne','goûte','note']);
let _VF=null;
function verbForms(){
  if(_VF)return _VF;
  _VF=new Set();
  Object.keys(CONJ).forEach(v=>['present','imparfait','futur'].forEach(tk=>{(CONJ[v][tk]||[]).forEach(f=>{const w=f.replace(/’/g,"'").split(/[ ']/).pop();_VF.add(w.toLowerCase())})}));
  return _VF;
}
function genLire(t){
  const r=R.f();
  if(r<0.45||t===1){
    /* mot qui manque, un seul mot de la bonne classe possible */
    const rec=pick(D.pos).split(' ').map(x=>{const i=x.indexOf(':');return i<0?{w:x,t:null}:{w:x.slice(0,i),t:x.slice(i+1)}});
    const cands=rec.map((x,i)=>i).filter(i=>rec[i].t&&['N','V','A'].includes(rec[i].t)&&rec[i].w.length>2&&i>0);
    if(!cands.length)return null;
    const i=pick(cands),ans=rec[i].w;
    const other=[];
    D.pos.forEach(s=>s.split(' ').forEach(x=>{const j=x.indexOf(':');if(j>0){const tg=x.slice(j+1),w=x.slice(0,j);if(tg!==rec[i].t&&['N','V','A','D'].includes(tg)&&!(rec[i].t==='N'&&tg==='A')&&w.toLowerCase()!==ans.toLowerCase()&&!HOMOG.has(w.toLowerCase())&&(rec[i].t!=='V'||tg==='D'||!verbForms().has(w.toLowerCase())))other.push(tg==='D'?w.toLowerCase():w)}}));
    const tx=rec.map((x,j)=>j===i?'___':x.w);
    let text='';tx.forEach((w,j)=>{text+=(j&&!/^[.?!]$/.test(w)?' ':'')+w});
    return CH({lead:'Lis la phrase. Quel mot la complète le mieux ?',text,ans,wrong:other,n:t===1?3:4,
      hint:'Relis la phrase en essayant chaque mot. Une seule phrase a du sens.',
      expl:`On écrit : ${posText(rec)}`,key:'cloze:'+rec[i].t,lab:'phrase à compléter',tier:t});
  }
  if(r<0.75){
    const s=pick(D.svc),sent=`${s[0]} ${s[1]} ${s[2]}`;
    const ws=D.svc.filter(x=>x[0]!==s[0]).map(x=>x[0]);
    const comp=s[2].replace(/[.!?]$/,'');
    return CH({lead:'Lis la phrase. Quel groupe de mots dit qui fait l’action ?',text:sent,ans:s[0],wrong:ws.concat(t>=2?[comp]:[]),n:t===1?3:4,
      hint:'Pose la question « Qui est-ce qui… ? » devant le verbe.',expl:`Dans la phrase, ${gq(s[0])} fait l’action : c’est le sujet.`,key:'qui',lab:'qui fait l’action',tier:t});
  }
  const n=pick(D.neg);
  return CH({lead:`Quelle phrase dit le contraire de ${gq(n[0])} ?`,ans:n[1],wrong:[n[2],n[3],n[0]],n:4,
    hint:'Pour dire « non », on met « ne » avant le verbe et « pas » après.',expl:`On écrit : ${n[1]}`,key:'neg',lab:'phrase négative',tier:t});
}

/* ---------- L3 et L4 : textes ---------- */
function textQuestion(tx,qa,st,idx,tier,withTitle){
  const [question,ok,w1,w2,type,hint]=qa;
  const q=CH({lead:question,ans:ok,wrong:[w1,w2],n:3,hint,expl:`La réponse est : ${ok}`,key:'txt:'+type,lab:'compréhension',tier});
  q.title=tx.t;q.paras=tx.p;q.st=st;q.tid=tx.id;
  return q;
}

/* ---------- M1 : dictée de lettres ---------- */
const CONF={b:'d',d:'b',p:'q',q:'p',m:'n',n:'m',u:'n',a:'o',e:'i',i:'l',l:'t',t:'f',s:'z',c:'s',g:'j',j:'g',v:'w'};
function genDictee(t){
  const pool=D.dictee.filter(x=>x[2]===t);
  const e=pick(pool.length?pool:D.dictee),w=e[0];
  const letters=[...w];
  const nx=t===1?0:t===2?2:3;
  const extra=[];
  const conf=letters.map(c=>CONF[c]).filter(Boolean);
  const abc='abcdefghijklmnopqrstuvxyz';
  for(let i=0;i<nx;i++){
    let c=i===0&&conf.length?pick(conf):abc[rnd(abc.length)];
    if(c===undefined)c='e';
    extra.push(c);
  }
  return BUILD({lead:'Écris le mot qui correspond à l’indice. Touche les lettres dans l’ordre.',text:e[1],tokens:letters.concat(extra),target:letters,join:'',
    hint:`Le mot commence par ${gq(w[0])} et il a ${letters.length} lettres.`,expl:`Le mot était ${gq(w)}.`,say:w,key:'dic:'+w,lab:w,tier:t});
}

/* ---------- M2 : mots invariables ---------- */
function genInv(t){
  const e=pick(D.inv);
  return CH({lead:'Quel mot est bien écrit pour compléter la phrase ?',text:e[3],ans:e[0],wrong:[e[1],e[2]],n:3,
    hint:`Ce mot ne change jamais. Il commence par ${gq(e[0][0])}.`,expl:`On écrit : ${e[3].replace('___',e[0])}`,key:'inv:'+e[0],lab:e[0],tier:t});
}

/* ---------- M3 : lettres muettes ---------- */
function genMut(t){
  const e=pick(D.mut),[w,l,fam]=e,base=w.slice(0,-l.length),sf=D.mutSafe[w];
  const hint=`Cherche un mot de la même famille : ${gq(fam)}. Quelle lettre entends-tu en plus ?`;
  const expl=`On écrit ${gq(w)} avec un ${gq(l)} muet : on l’entend dans ${gq(fam)}.`;
  if(t===1||R.f()<0.5){
    return CH({lead:'Quelle lettre muette faut-il écrire à la fin du mot ?',text:base+'___',ans:l,wrong:sf.l,n:4,
      hint,expl,key:'mut:'+w,lab:w,tier:t});
  }
  return CH({lead:'Quel mot est bien écrit ?',ans:w,wrong:(sf.b?[base]:[]).concat(sample(sf.l,3).map(x=>base+x)),n:4,
    hint,expl,key:'mut:'+w,lab:w,tier:t});
}

/* ---------- M4 : un son, plusieurs écritures ---------- */
function genGraph(t){
  const e=pick(D.graph);

function splitForm(f){

const ENDS={
 present:'Au présent, les verbes en -er finissent par : -e, -es, -e, -ons, -ez, -ent. Les verbes comme être, avoir ou aller ont des formes à apprendre.',

 futur:'Au futur, on entend un « r » avant la terminaison : -ai, -as, -a, -ons, -ez, -ont (je chanterai). Certains verbes changent de radical (je serai, j’irai).',

    const wrong=D.eur.filter(x=>x!==e).map(x=>x[1]);
    return CH({lead:`Celui qui ${D.eurV[e[0]]} s’appelle un…`,ans:e[1],wrong,n:4,
      hint:`On ajoute -eur à la racine du verbe ${gq(e[0])}.`,expl:`Celui qui ${e[0]} est un ${gq(e[1])}.`,key:'eur:'+e[0],lab:e[1],tier:t});
  }
  if(t>=2&&r<0.4){
    const e=pick(D.ette);
    const wrong=D.ette.filter(x=>x!==e).map(x=>x[1]);
    return CH({lead:`Une petite ${e[0]} s’appelle une…`,ans:e[1],wrong,n:4,
      hint:'Pour dire « petit », on ajoute la fin -ette.',expl:`Une petite ${e[0]} est une ${gq(e[1])}.`,key:'ette:'+e[0],lab:e[1],tier:t});
  }
  const f=pick(D.fam);
  if(r<0.7||t===1){
    const ans=pick(f[1]);
    const wrong=t===1?D.fam.filter(x=>x!==f).flatMap(x=>x[1]):f[2];
    return CH({lead:`Quel mot est de la famille de ${gq(f[0])} ?`,ans,wrong,n:t===1?3:4,
      hint:`Un mot de la famille garde la même racine et parle de la même chose que ${gq(f[0])}.`,expl:`${cap(ans)} est de la famille de ${gq(f[0])}.`,key:'fam:'+f[0],lab:f[0],tier:t});
  }

    hint:'Il ressemble aux autres, mais il ne parle pas de la même chose.',expl:`${cap(intr)} ressemble à ${f[0]}, mais n’en fait pas partie.`,key:'fam:'+f[0],lab:f[0],tier:t});

/* ---------- W4 : ordre alphabétique ---------- */
const ABC='abcdefghijklmnopqrstuvwxyz';
const cmpAlpha=(a,b)=>{const x=noAcc(a),y=noAcc(b);return x<y?-1:x>y?1:0};
function genAlpha(t){
  const r=R.f();
  if(t===1&&r<0.35){
    const i=rnd(24)+1,l=ABC[i];
    const ans=ABC[i+1];
    return CH({lead:`Quelle lettre vient juste après ${gq(l)} dans l’alphabet ?`,ans,wrong:[ABC[i-1],ABC[i+2]||ABC[i-2],ABC[(i+5)%26]],n:4,
      hint:'Chante l’alphabet dans ta tête : a, b, c, d…',expl:`Après ${gq(l)}, il y a ${gq(ans)}.`,key:'abc:lettre',lab:'lettres',tier:t});
  }
  if(t>=2&&r<0.2){
    const i=rnd(23)+2,l=ABC[i],ans=ABC[i-1];
    return CH({lead:`Quelle lettre vient juste avant ${gq(l)} dans l’alphabet ?`,ans,wrong:[ABC[i+1],ABC[i-2],ABC[(i+7)%26]],n:4,
      hint:'Chante l’alphabet dans ta tête depuis le début.',expl:`Avant ${gq(l)}, il y a ${gq(ans)}.`,key:'abc:lettre',lab:'lettres',tier:t});
  }
  if(t===1||(t===2&&r<0.5)){
    const ws=sample(D.alphaPool,t===1?3:4);
    const first=ws.slice().sort(cmpAlpha)[0];
    if(new Set(ws.map(w=>noAcc(w)[0])).size<ws.length)return null;
    return CH({lead:'Quel mot vient en premier dans le dictionnaire ?',ans:first,wrong:ws,n:ws.length,
      hint:'Regarde la première lettre de chaque mot. Laquelle est la plus proche du début de l’alphabet ?',expl:`${cap(first)} vient en premier.`,key:'abc:mots',lab:'ordre',tier:t});
  }
  let ws;
  if(t<=2){ws=sample(D.alphaPool,4)}
  else{ws=sample(pick(D.alphaSets),4)}
  const target=ws.slice().sort(cmpAlpha);
  if(target.join()===ws.join())return null;
  return BUILD({lead:'Range les mots dans l’ordre du dictionnaire.',sub:t>=3?'Les mots commencent par la même lettre : regarde la deuxième lettre.':'Touche les mots dans l’ordre, du premier au dernier.',
    tokens:ws,target,join:' ',hint:'Compare d’abord la première lettre. S’il y en a deux pareilles, regarde la lettre d’après.',expl:`Dans l’ordre : ${target.join(', ')}.`,key:'abc:mots',lab:'ordre',tier:t});
}

/* ---------- W5 : catégories et sens ---------- */
const catName=k=>D.cats[k].l.replace(/^des /,'les ');
function genCat(t){
  const keys=Object.keys(D.cats),r=R.f();
  if(t>=2&&r<0.3){
    const e=pick(D.poly),i=rnd(2),o=e[1+i],oo=e[2-i];
    const other=pick(D.poly.filter(x=>x!==e));
    return CH({lead:`Dans cette phrase, que veut dire ${gq(e[0])} ?`,text:o[1],ans:o[0],wrong:[oo[0],other[1][0]],n:3,
      hint:'Un même mot peut avoir plusieurs sens. Lis la phrase et regarde les autres mots.',expl:`Ici, ${e[0]} veut dire : ${o[0]}.`,key:'poly:'+e[0],lab:e[0],tier:t});
  }
  if(t>=3&&r<0.45){
    const e=pick(D.reg);
    return CH({lead:'Tu parles à ta maîtresse. Quel mot est le mieux choisi ?',ans:e[1],wrong:[e[0]],n:2,
      hint:'Il y a des mots de tous les jours, et des mots plus familiers qu’on dit entre copains.',expl:`On dit plutôt ${gq(e[1])}, c’est le mot de tous les jours.`,key:'reg',lab:e[1],tier:t});
  }
  const k=pick(keys),c=D.cats[k];
  if(t===1||r<0.65){
    const k2=pick(keys.filter(x=>x!==k)),intr=pick(D.cats[k2].w);
    if(c.w.includes(intr))return null;
    return CH({lead:`Trois mots sont ${c.l}. Un mot est l’intrus. Lequel ?`,ans:intr,wrong:c.w,n:4,
      hint:'Cherche le mot qui ne va pas avec les autres.',expl:`${cap(intr)} n’est pas dans le groupe ${gq(c.l)}.`,key:'cat:'+k,lab:catName(k),tier:t});
  }
  const three=sample(c.w,3);
  return CH({lead:'Quel est le nom de ce groupe de mots ?',text:three.join(', '),ans:catName(k),wrong:keys.map(catName),n:4,
    hint:'Cherche ce que tous ces mots ont en commun.',expl:`${three.join(', ')} : ce sont ${c.l}.`,key:'cat:'+k,lab:catName(k),tier:t});
}

/* ---------- E1 : copier sans erreur ---------- */
function corrupt(w,t){
  const L=[...w];
  const ops=[];
  const idxs=L.map((c,i)=>i).filter(i=>i>0&&/[a-zéèêàâîôûç]/i.test(L[i]));
  ops.push(()=>{const i=pick(idxs);const x=L.slice();x.splice(i,1);return x.join('')});
  ops.push(()=>{const i=pick(idxs);const x=L.slice();x.splice(i,0,x[i]);return x.join('')});
  if(t>=2)ops.push(()=>{const i=pick(idxs.filter(j=>j<L.length-1&&L[j]!==L[j+1]));if(i===undefined)return w;const x=L.slice();[x[i],x[i+1]]=[x[i+1],x[i]];return x.join('')});
  if(t>=2)ops.push(()=>{const i=pick(idxs.filter(j=>CONF[L[j]]&&'bdpqmnu'.includes(L[j])));if(i===undefined)return w;const x=L.slice();x[i]=CONF[x[i]];return x.join('')});
  if(t>=3)ops.push(()=>{const i=pick(L.map((c,j)=>j).filter(j=>/[éèêàâîôûç]/.test(L[j])));if(i===undefined)return w;const x=L.slice();x[i]=noAcc(x[i]);return x.join('')});
  for(let k=0;k<12;k++){const r=pick(ops)();if(r!==w&&r.length>0)return r}
  return null;
}
function genCopy(t){
  const pool=D.build.filter(x=>x[1]===t).map(x=>x[0]).concat(t>=2?D.fix.map(x=>x[0]):[]);
  const s=pick(pool.length?pool:D.build.map(x=>x[0]));
  const toks=sentTokens(s);
  const cand=toks.map((w,i)=>i).filter(i=>[...toks[i]].length>=4&&!/^[.?!]$/.test(toks[i]));
  if(!cand.length)return null;
  const i=pick(cand),bad=corrupt(toks[i].replace(/[,.]$/,''),t);
  if(!bad)return null;
  const copy=toks.slice();copy[i]=bad+(/[,]$/.test(toks[i])?',':'');
  return TAP({lead:'Compare avec la phrase modèle. Touche le mot recopié avec une erreur.',text:s,tokens:copy,ans:[i],
    hint:'Lis les deux phrases mot après mot. Compte les lettres de chaque mot.',expl:`Le bon mot est ${gq(toks[i])}.`,key:'copy',lab:'recopier',tier:t});
}

/* ---------- E2 : histoires en ordre ---------- */
function genStory(t){
  const pool=D.stories.filter(x=>x.t===t);
  const st=pick(pool.length?pool:D.stories);
  return BUILD({lead:'Remets les phrases dans l’ordre de l’histoire.',sub:'Touche les phrases une par une, de la première à la dernière.',tokens:st.s,target:st.s,join:'\n',
    hint:'Cherche les petits mots qui donnent l’ordre : d’abord, ensuite, puis, enfin.',expl:'L’histoire dans l’ordre : '+st.s.join(' '),key:'story',lab:'histoire',tier:t,wide:true});
}

/* ---------- E3 : corriger une phrase ---------- */
function genFix(t){
  const i=rnd(D.fix.length),[good,bad]=D.fix[i];
  const gt=sentTokens(good),bt=sentTokens(bad);
  if(t>=2&&gt.length===bt.length&&R.f()<0.6){
    const diff=gt.map((w,j)=>w!==bt[j]?j:-1).filter(j=>j>=0);
    if(diff.length===1){
      return TAP({lead:'Cette phrase contient une erreur. Touche le mot mal écrit.',tokens:bt,ans:diff,
        hint:'Lis la phrase en regardant la fin de chaque mot, et demande-toi : est-ce que ça s’accorde ?',expl:`La phrase correcte est : ${good}`,key:'fix',lab:'corriger',tier:t});
    }
  }
  const noCap=good.charAt(0).toLowerCase()+good.slice(1);
  const noPunct=good.replace(/\s?[.?!]$/,'');
  return CH({lead:'Quelle phrase est bien écrite ?',ans:good,wrong:[bad,noCap,noPunct],n:t===1?3:4,
    hint:'Une phrase bien écrite commence par une majuscule, finit par un point, et ses mots s’accordent.',expl:`La phrase correcte est : ${good}`,key:'fix',lab:'corriger',tier:t});
}

/* ---------- Construction d'une mission ---------- */
function weakness(state,key){
  const s=state&&state.sk&&state.sk[key];
  if(!s)return 1.2;
  const ok=s[0],ko=s[1];
  return 0.6+2.2*(ko/(ok+ko+1));
}
function pickWeighted(cands,state,usedKeys){
  const ws=cands.map(q=>weakness(state,q.key)*(usedKeys.includes(q.key)?0.35:1));
  const sum=ws.reduce((a,b)=>a+b,0);let r=R.f()*sum;
  for(let i=0;i<cands.length;i++){r-=ws[i];if(r<=0)return cands[i]}
  return cands[cands.length-1];
}
function tiersFor(state,id){
  const s=state&&state.st&&state.st[id];
  if(!s||!s.runs)return TIERS;
  const recent=(s.recent||[]).slice(-3);
  const avg=recent.length?recent.reduce((a,b)=>a+b,0)/recent.length:0.6;
  if(avg<0.55)return [1,1,1,1,1,2,2,2,2,3];
  if(avg>0.9&&s.stars===3)return [1,2,2,2,3,3,3,3,3,3];
  return TIERS;
}
const TXT={L3:['t3',3],L4:['t4',2],L5:['t5',2],L6:['t6',2]};
function textMission(id,state){
  const L3=id==='L3',arr=D[TXT[id][0]],need=TXT[id][1];
  const seen=(state&&state.seenT)||{};
  const order=arr.slice().sort((a,b)=>((seen[a.id]||0)-(seen[b.id]||0))+(R.f()-0.5)*0.3);
  const out=[];
  order.slice(0,need).forEach(tx=>{
    const qs=L3?tx.q:tx.q;
    qs.forEach((qa,i)=>{const q=textQuestion(tx,qa,id,i,L3?1+Math.floor(out.length/4):id==='L4'?2+(i>2?1:0):3);if(q)out.push(q)});
  });
  return out.slice(0,10);
}
function buildMission(id,state){
  if(TXT[id]){
    const qs=textMission(id,state);
    qs.forEach(q=>{q.st=id});
    return qs;
  }
  const st=STID[id],tiers=tiersFor(state,id),out=[],sigs=new Set(),keys=[];
  for(let i=0;i<tiers.length;i++){
    const cands=[];
    for(let k=0;k<60&&cands.length<6;k++){
      const tt=k<40?tiers[i]:Math.max(1,Math.min(3,tiers[i]+(k%2?1:-1)));
      const q=st.gen(tt);
      if(!q)continue;
      q.st=id;q.tier=tt;
      const sg=sig(q);
      if(sigs.has(sg)||cands.some(c=>sig(c)===sg))continue;
      cands.push(q);
    }
    if(!cands.length)continue;
    const q=pickWeighted(cands,state,keys);
    sigs.add(sig(q));keys.push(q.key);out.push(q);
  }
  return out;
}

/* ===== Générateurs CE2 (fonctions seulement : tout est calculé à l'appel) ===== */
const lowFirst=s=>/^(Le|La|Les|Mon|Ma|Mes|Un|Une) /.test(s)?s.charAt(0).toLowerCase()+s.slice(1):s;
const stripP=s=>s.replace(/[.,]$/,'');
const elideNe=w=>/^[aeiouyhéèêâîôûàAEIOUH]/.test(w)?'n’':'ne ';
let _chk=null;
function chunkList(){
  if(_chk)return _chk;
  _chk=D.chunks.map(l=>{const out=[];const re=/(.+?)\|([SVLTM])(?:\s|$)/g;let m;while((m=re.exec(l)))out.push({t:m[1],k:m[2]});return out});
  return _chk;
}
const chunkText=s=>s.map(c=>c.t).join(' ');

/* ---------- M5 : accents et cédille ---------- */
function genAccent(t){
  const useCed=t>=2&&R.f()<0.3;
  const list=useCed?D.ortho.ced:D.ortho.acc;
  if(t>=2&&R.f()<0.4){
    const e=pick(list);
    const others=sample(list.filter(x=>x[0]!==e[0]).map(x=>x[0]),3);
    const bad=pick(e[1]);
    return CH({lead:'Un seul de ces mots est mal écrit. Lequel ?',ans:bad,wrong:others,n:4,
      hint:useCed?'La cédille (ç) s’écrit devant a, o, u pour faire le son « s » : garçon, leçon, reçu.':'Regarde les accents : é (été), è (père), ê (forêt). Un mot a un accent qui manque ou qui n’est pas le bon.',
      expl:`Le mot ${gq(bad)} est mal écrit : on écrit ${gq(e[0])}.`,key:'acc:'+e[0],lab:e[0],tier:t});
  }
  const e=pick(list);
  return CH({lead:'Quelle écriture est correcte ?',ans:e[0],wrong:e[1],n:t===1?3:4,
    hint:useCed?'La cédille (ç) s’écrit devant a, o, u pour faire le son « s » : garçon, leçon, reçu.':'Dis le mot lentement. Un « é » fermé ressemble à celui de « été », un « è » ouvert à celui de « père ».',
    expl:`On écrit : ${e[0]}.`,key:'acc:'+e[0],lab:e[0],tier:t});
}

/* ---------- M6 : règles d'orthographe ---------- */
const RULE={
 mbp:'Devant m, b et p, on écrit « m » et pas « n » : lampe, jambe, nombre.',
 gu:'Pour le son « g » devant e ou i, on écrit « gu » : guitare, guêpe, fatigue.',
 ge:'Devant a ou o, on écrit « ge » pour garder le son « j » : mangeons, plongeon.',
 ss:'Entre deux voyelles, un seul « s » fait le son « z ». Pour le son « s », on écrit « ss » : tasse, dessin.',

};
function genRegle(t){
  const cats=t===1?['mbp','dbl']:t===2?['mbp','dbl','ss','gu']:['mbp','dbl','ss','gu','ge'];
  const cat=pick(cats);
  const e=pick(D.ortho[cat]);
  return CH({lead:'Quelle écriture est correcte ?',ans:e[0],wrong:e[1],n:Math.min(t===1?3:4,e[1].length+1),
    hint:RULE[cat],expl:`On écrit : ${e[0]}. ${RULE[cat]}`,key:'reg:'+cat,lab:RULE[cat].split(':')[0],tier:t});
}

/* ---------- P5 : la phrase négative ---------- */
function genNeg(t){
  const e=pick(D.neg2),S=cap(e.s);
  const jam=t>=2&&R.f()<0.45,neg=jam?'jamais':'pas';
  const pc=t>=3&&R.f()<0.5;
  let pos,good,wr;
  if(!pc){
    const ne=elideNe(e.v);
    pos=`${S} ${e.v} ${e.c}.`;
    good=`${S} ${ne}${e.v} ${neg} ${e.c}.`;
    wr=[`${S} ${ne}${e.v} ${e.c} ${neg}.`,`${S} ${e.v} ne ${neg} ${e.c}.`,`${S} ne ${neg} ${e.v} ${e.c}.`,`${S} ${e.v} ${neg} ${e.c}.`];
  }else{
    const [aux,part]=e.pc,ne=elideNe(aux);
    pos=`${S} ${aux} ${part} ${e.c}.`;
    good=`${S} ${ne}${aux} ${neg} ${part} ${e.c}.`;
    wr=[`${S} ${ne}${aux} ${part} ${neg} ${e.c}.`,`${S} ${aux} ne ${neg} ${part} ${e.c}.`,`${S} ne ${neg} ${aux} ${part} ${e.c}.`,`${S} ${aux} ${neg} ${part} ${e.c}.`];
  }
  const hint=pc?'Au passé composé, « ne … pas » entoure l’auxiliaire (a, ont…) : il n’a pas mangé.':'Pour dire non, on entoure le verbe : « ne » avant, « pas » (ou « jamais ») après. Devant une voyelle, « ne » devient « n’ ».';
  const expl=`À la forme négative : ${good}`;
  if(t>=2&&R.f()<0.4){
    const tk=sentTokens(good);
    return BUILD({lead:'Remets les mots dans l’ordre pour écrire la phrase à la forme négative.',text:pos,tokens:tk,target:tk,join:' ',hint,expl,key:'neg2',lab:'phrase négative',tier:t});
  }
  return CH({lead:'Quelle phrase est bien écrite à la forme négative ?',text:pos,ans:good,wrong:wr,n:t===1?3:4,hint,expl,key:'neg2',lab:'phrase négative',tier:t});
}

/* ---------- P6 : où, quand, comment ? ---------- */
const CCQ={L:'dit où',T:'dit quand',M:'dit comment',S:'dit qui fait l’action'};
const CCH={
 L:'Pose la question « où ? » à la phrase : le groupe de mots qui répond dit le lieu.',
 T:'Pose la question « quand ? » à la phrase : le groupe de mots qui répond dit le moment.',
 M:'Pose la question « comment ? » à la phrase : le groupe de mots qui répond dit la manière.',
 S:'Pose la question « Qui est-ce qui… ? » devant le verbe : la réponse est le sujet.'
};
function genCC(t){
  const kinds=t===1?['L','T']:t===2?['L','T','M']:['L','T','M','S'];
  for(let n=0;n<30;n++){
    const kind=pick(kinds);
    const cands=chunkList().filter(s=>s.filter(c=>c.k===kind).length===1&&s.length>=4);
    if(!cands.length)continue;
    const s=pick(cands),a=s.find(c=>c.k===kind);
    const wrong=s.filter(c=>c!==a).map(c=>stripP(c.t));
    const q=CH({lead:`Dans cette phrase, quel groupe de mots ${CCQ[kind]} ?`,text:chunkText(s),ans:stripP(a.t),wrong,n:t===1?3:4,
      hint:CCH[kind],expl:`${cap(stripP(a.t))} répond à la question ${kind==='S'?'« Qui est-ce qui… ? »':'« '+({L:'où',T:'quand',M:'comment'}[kind])+' ? »'}.`,key:'cc:'+kind,lab:CCQ[kind],tier:t});
    if(q)return q;
  }
  return null;
}

/* ---------- P7 : les pronoms ---------- */
function genPronS(t){
  const ok=t===1?['il','elle','ils','elles']:t===2?['il','elle','ils','elles','nous']:['il','elle','ils','elles','nous','vous'];

    expl:`On remplace ${gq(e[0])} par ${gq(e[1])} : ${cap(e[1])} ${e[2]} ${e[3]}`,key:'pr:'+e[1],lab:e[1],tier:t});
}

/* ---------- A6 : ce / se, ces / ses, c'est / s'est, mais / mes, la / là ---------- */
function genHomo2(t){
  const pairs=t===1?D.homo2.pairs.slice(0,2):t===2?D.homo2.pairs.slice(0,4):D.homo2.pairs;

/* ---------- A7 : accord de l'adjectif et du participe avec être ---------- */
function genAttr(t){
  const partic=t>=2&&R.f()<(t===2?0.3:0.5);
  const mixed=t>=3&&R.f()<0.3;
  const sub=pick(mixed?D.attrM:D.attrS);
  const gender=sub[1],num=sub[2],idx=gender+2*num;
  const idDesc=`${sub[0]} ${num?'sont':'est'} ${gender?'féminin':'masculin'} ${num?'pluriel':'singulier'}`;
  const why=mixed?`Avec un garçon et une fille, on accorde au masculin pluriel.`:`${cap(idDesc)}.`;
  if(!partic){
    const adj=pick(D.attrA),ans=adj[idx];
    const cop=num?(t>=2&&R.f()<0.4?'étaient':'sont'):(t>=2&&R.f()<0.4?'était':'est');
    const wr=uniq(adj.filter(x=>x!==ans));
    return CH({lead:'Quelle forme de l’adjectif complète la phrase ?',text:`${sub[0]} ${cop} ___.`,ans,wrong:wr,n:Math.min(t===1?3:4,wr.length+1),
      hint:'Cherche le sujet : est-ce un garçon ou une fille ? Un seul ou plusieurs ? L’adjectif s’accorde avec lui.',
      expl:`${why} On écrit : ${sub[0]} ${cop} ${ans}.`,key:'attr:'+(gender?'f':'m')+(num?'p':'s'),lab:'accord de l’adjectif',tier:t});
  }
  const v=pick(D.attrP),ans=v[1+idx];
  const aux=num?'sont':'est';
  const wr=uniq(v.slice(1,5).filter(x=>x!==ans));
  return CH({lead:'Quelle forme du participe passé complète la phrase ?',text:`Hier, ${lowFirst(sub[0])} ${aux} ___ ${v[5]}.`,ans,wrong:wr,n:Math.min(4,wr.length+1),
    hint:'Avec le verbe être, le participe passé s’accorde avec le sujet, comme un adjectif.',
    expl:`${why} On écrit : ${sub[0]} ${aux} ${ans} ${v[5]}.`,key:'attr:pp',lab:'participe passé avec être',tier:t});
}

/* ---------- A8 : pluriels particuliers ---------- */
const PLH={

 ou2:'Les autres noms en -ou prennent un s : un trou, des trous.',

function genPlur2(t){
  const okk=t===1?['al','eau']:t===2?['al','eau','eu','au','ou']:['al','eau','eu','au','ou','ou2','inv'];

/* ---------- V7, V8 : imparfait et futur ---------- */
const TNAME=['present','imparfait','futur','pc'];
function poolAll(){return CONJ_ER.concat(['manger','nager','être','avoir','aller','faire','dire','venir','pouvoir','voir','vouloir','prendre'])}
function genNomTemps(tiers){
  return function(t){
    const pool=poolAll(),verb=pick(pool),tk=tenseOf(tiers,t);
    const s=pick(SUBJ.filter(x=>subjOk(x,verb,tk)&&x[0]!=='je'));
    const f=CONJ[verb][tk][s[1]],[,vp]=splitForm(f);
    const comp=pick(D.comp[verb]);
    const mk=(t>=3&&R.f()<0.6)?'':pick(D.mark[tk])+' ';
    const subj=mk?s[0]:cap(s[0]);
    const before=`${mk}${subj} `;
    const text=`${before}${vp} ${comp}.`.replace(/'/g,'’');
    const q=CH({lead:'À quel temps est le verbe en couleur ?',text,ans:D.tenseNames[tk],wrong:TNAME.filter(x=>x!==tk).map(x=>D.tenseNames[x]),n:t===1?3:4,
      hint:ENDS[tk],expl:`Le verbe est ${D.tenseAu[tk]} : ${CONJ[verb][tk].join(', ')}.`.replace(/'/g,'’'),key:'nt:'+tk,lab:D.tenseNames[tk],tier:t});
    if(q)q.markAt=[before.length,before.length+vp.length];
    return q;
  };
}
function genV7(t){
  const A=[['imparfait'],['imparfait'],['imparfait']],N=[['imparfait','present'],['imparfait','present','futur'],['imparfait','present','futur','pc']];
  return mix(genFill(poolAll(),A),genFill(poolAll(),A),genPron(poolAll(),A),genNomTemps(N))(t);
}
function genV8(t){
  const A=[['futur'],['futur'],['futur']],N=[['futur','present'],['futur','present','imparfait'],['futur','present','imparfait','pc']];
  return mix(genFill(poolAll(),A),genFill(poolAll(),A),genPron(poolAll(),A),genNomTemps(N))(t);
}

/* ---------- V9 : -er, -é, -ez ---------- */
function genEr(t){
  const pool=CONJ_ER.filter(v=>/^j.ai /.test(CONJ[v].pc[0])).concat(['manger','nager']);
  const verb=pick(pool),inf=verb;
  const pp=CONJ[verb].pc[2].split(' ').pop(),vous=splitForm(CONJ[verb].present[4])[1];
  const comp=pick(D.comp[verb]);
  const kind=pick(t===1?['inf','pp']:['inf','pp','vous']);
  let text,ans,hint;
  const test='Remplace le verbe par « vendre » ou « vendu » : on dit « Léa veut vendre » (infinitif, -er) mais « Léa a vendu » (participe passé, -é).';
  if(kind==='inf'){text=`${pick(['Léa veut','Tom va','Il faut','Nous allons','Papa aime','Mamie préfère','Les enfants adorent'])} ___ ${comp}.`;ans=inf;hint=test}
  else if(kind==='pp'){text=`${pick(['Léa a','Tom a','Nous avons','Papa a','Les enfants ont','Mamie a','Hier, Zoé a'])} ___ ${comp}.`;ans=pp;hint=test}
  else{text=`Vous ___ ${comp}.`;ans=vous;hint='Avec « vous », le verbe finit par -ez : vous chantez, vous mangez.'}
  const wr=[inf,pp,vous].filter(x=>x!==ans);
  if(t>=3)wr.push(splitForm(CONJ[verb].imparfait[2])[1]);
  return CH({lead:'Quelle écriture complète la phrase ?',text,ans,wrong:wr,n:Math.min(t===1?3:4,uniq(wr).length+1),hint,
    expl:`${cap(text.replace('___',ans))} ${kind==='inf'?'(infinitif : on peut dire « vendre »).':kind==='pp'?'(participe passé : on peut dire « vendu »).':''}`.trim(),key:'er:'+kind,lab:'-er, -é ou -ez',tier:t});
}

/* ---------- V10 : participes passés et auxiliaires ---------- */
const ETRE=['suis','es','est','sommes','êtes','sont'],AVOIR=['ai','as','a','avons','avez','ont'],PERS=['je','tu','il','nous','vous','ils'];
function genPP(t){

    return CH({lead:`Quel est le participe passé du verbe ${gq(inf)} ?`,text:aux==='e'?'Hier, il est ___.':'Hier, il a ___.',ans:p,wrong:vs,n:Math.min(4,vs.length+1),
      hint:'Pense à une phrase au passé composé : « Hier, j’ai… » ou « Hier, je suis… ». Les verbes irréguliers ont un participe à apprendre.',
      expl:`Le participe passé de ${gq(inf)} est ${gq(p)} : ${aux==='e'?'il est ':'il a '}${p}.`,key:'pp:'+inf,lab:inf,tier:t});

      hint:'Les verbes aller, venir, partir et sortir se conjuguent avec « être » au passé composé. Accorde-le avec le sujet.',
      expl:`On écrit : Hier, ${PERS[i]} ${ans} ${part}.`,key:'aux:e',lab:'être au passé composé',tier:t});
  }
  const i=1+rnd(5),ans=AVOIR[i];
  return CH({lead:'Choisis le bon verbe pour compléter la phrase.',text:`Hier, ${PERS[i]} ___ ${p}.`,ans,wrong:AVOIR.filter(x=>x!==ans),n:4,
    hint:'Au passé composé, on conjugue « avoir » avec le sujet : il a, nous avons, ils ont.',
    expl:`On écrit : Hier, ${PERS[i]} ${ans} ${p}.`,key:'aux:a',lab:'avoir au passé composé',tier:t});
}

/* ---------- W6 : préfixes et suffixes ---------- */
const FAM={'in-':'in','im-':'in','il-':'in','dé-':'de','dés-':'de'};
function genAffix(t){
  const r=R.f();
  if(r<0.4){
    const pool=t===1?D.affix.filter(x=>['re-','dé-','in-','-eur'].includes(x[2])):D.affix;
    const e=pick(pool);
    const wrong=sample(D.affix.filter(x=>x[2]!==e[2]).map(x=>x[0]),3);
    return CH({lead:`Quel mot veut dire ${gq(e[3])} ?`,ans:e[0],wrong,n:4,
      hint:'Cherche le début ou la fin du mot : le préfixe (devant) ou le suffixe (derrière) change le sens du mot de départ.',
      expl:`${cap(e[0])} se forme avec ${gq(e[2])} et le mot ${gq(e[1])} : ${e[3]}.`,key:'af:'+e[2],lab:e[2],tier:t});
  }
  if(r<0.75||t===1){
    const e=pick(D.affix),pre=e[2].endsWith('-');
    const kinds=pre?['re-','dé-','in-','sur-','mal-','pré-']:['-eur','-able','-ette','-oir','-erie','-ment','-tion'];
    const fam=FAM[e[2]]||e[2];
    const wrong=kinds.filter(x=>(FAM[x]||x)!==fam&&x!==e[2]);
    const ans=e[2];
    return CH({lead:`Dans le mot ${gq(e[0])}, quel est ${pre?'le préfixe':'le suffixe'} ?`,ans,wrong,n:t===1?3:4,
      hint:pre?'Le préfixe est la petite partie qu’on ajoute au début d’un mot.':'Le suffixe est la petite partie qu’on ajoute à la fin d’un mot.',
      expl:`Dans ${gq(e[0])}, on retrouve le mot ${gq(e[1])} avec ${gq(ans)}.`,key:'af2:'+(pre?'p':'s'),lab:pre?'préfixe':'suffixe',tier:t});
  }
  const pre=pick(['re-','dé-']);
  const ans=pick(D.affix.filter(x=>x[2]===pre))[0];
  return CH({lead:`Quel mot est formé avec le préfixe ${gq(pre)} ?`,ans,wrong:D.affixDecoy[pre],n:4,
    hint:'Enlève le début du mot : s’il reste un vrai mot (faire, couvrir…), le début est un préfixe.',
    expl:`${cap(ans)} = ${pre} + ${D.affix.find(x=>x[0]===ans)[1]}.`,key:'af3:'+pre,lab:pre,tier:t});
}

/* ---------- E4 : phrases plus longues ---------- */
function genBuild2(t){
  /* tuiles = groupes de mots ; les ordres valides en plus de l'original sont dans q.alts */
  const want=t===1?3:t===2?4:5;
  let pool=chunkList().filter(c=>c.length>=3&&c.every((x,k)=>x.k!=='T'||k===0));
  const ex=pool.filter(c=>c.length===want||(t===3&&c.length>=want));
  if(ex.length)pool=ex;
  const c=pick(pool);
  const raw=c.map(x=>stripP(x.t));
  const hasComma=c[0].k==='T';
  const toks=raw.map((w,k)=>k===0&&hasComma?w+',':w).concat(['.']);
  const alts=[];
  const n=c.length;
  if(n>=3&&c[n-1].k!=='V'&&c[n-2].k!=='V'&&c[n-1].k!==c[n-2].k&&['L','M'].includes(c[n-1].k)&&['L','M'].includes(c[n-2].k)){
    const a=toks.slice();[a[n-2],a[n-1]]=[a[n-1],a[n-2]];alts.push(a);
  }
  const text=toks.slice(0,-1).join(' ')+'.';
  return BUILD({lead:'Remets les groupes de mots dans l’ordre pour faire une phrase.',tokens:toks,target:toks,alts,join:' ',
    hint:'La phrase commence par une majuscule et finit par un point. Le groupe qui dit quand garde sa virgule. Le sujet se place avant le verbe.',
    expl:`La phrase est : ${text}`,key:'build2',lab:'phrases plus longues',tier:t});
}

/* ---------- E5 : relire un texte ---------- */
function diffTok(a,b){const x=sentTokens(a),y=sentTokens(b);if(x.length!==y.length)return -1;const d=x.map((w,i)=>w!==y[i]?i:-1).filter(i=>i>=0);return d.length===1?d[0]:-1}
function genRelire(t){
  const e=pick(D.fix2),bad=e.s[e.i];
  const di=diffTok(bad,e.g),bt=sentTokens(bad);
  const r=t===1?0:t===2?pick([0,1]):pick([1,2,2]);
  const hint='Relis chaque phrase en cherchant un accord ou un petit mot (a/à, et/est, ces/ses, ce/se…) qui ne va pas.';
  if(r===0||di<0){
    return CH({lead:'Dans ce petit texte, une phrase contient une erreur. Laquelle ?',ans:bad,wrong:e.s.filter((x,i)=>i!==e.i),n:3,
      hint,expl:`La phrase fautive est : ${bad} On écrit : ${e.g}`,key:'rel',lab:'relire un texte',tier:t});
  }
  if(r===1||!e.w){
    return TAP({lead:'Cette phrase contient une erreur. Touche le mot mal écrit.',tokens:bt,ans:[di],hint,expl:`On écrit : ${e.g}`,key:'rel',lab:'relire un texte',tier:t});
  }
  const gt=sentTokens(e.g);
  let off=0;for(let i=0;i<di;i++){off=bad.indexOf(bt[i],off)+bt[i].length}
  const start=bad.indexOf(bt[di],off);
  const q=CH({lead:`Dans cette phrase, par quel mot faut-il remplacer ${gq(bt[di].replace(/[,.]$/,''))} ?`,text:bad,ans:gt[di],wrong:e.w,n:3,
    hint,expl:`On écrit : ${e.g}`,key:'rel',lab:'relire un texte',tier:t});
  if(q)q.markAt=[start,start+bt[di].length];
  return q;
}

const LS_KEY='lexo.v2',LS_OLD='lexo.v1';
/* Échelle de paliers cumulés (même principe que Mission Calculo). Modifiable dans l'espace parents. */

].map((a,i)=>({id:i+1,name:a[0],icon:a[1],cost:a[2],got:false}))}

function matOf(i){let m=TIERS_MAT[0];TIERS_MAT.forEach(t=>{if(i>=t[2])m=t});return m}
const RANKS=[['Recrue',0],['Apprenti',8],['Éclaireur',20],['Bâtisseur',38],['Gardien',60],['Chevalier',85],['Maître',110],['Légende',135]];
function dayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function defaultState(){

}
function cleanState(o){
  const d=defaultState();

  ['sk','st','err','seenT','open','eclair'].forEach(k=>{if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))s[k]=d[k]});
  ['flu','hist'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=d[k]});
  const a=Array.isArray(s.lad)?s.lad:[];
  s.lad=a.filter(r=>r&&typeof r==='object'&&typeof r.name==='string'&&Number(r.cost)>0).slice(0,30).map((r,i)=>({id:Number(r.id)||(1000+i),name:String(r.name).slice(0,60),icon:RW_KEYS.indexOf(r.icon)>=0?r.icon:'toy',cost:Math.min(2000,Math.max(1,Math.round(Number(r.cost)))),got:!!r.got}));
  if(!s.lad.length)s.lad=defaultLadder();
  s.crystals=Math.max(0,Number(s.crystals)||0);s.ladBase=Math.max(0,Number(s.ladBase)||0);
  s.cap=Math.min(20,Math.max(3,Math.round(Number(s.cap)||10)));

const Store={
  mem:null,broken:false,ok:true,onSave:null,
  load(){
    let raw=null,old=false;
    try{raw=window.localStorage.getItem(LS_KEY);if(!raw){raw=window.localStorage.getItem(LS_OLD);old=!!raw}}catch(e){this.ok=false}
    if(raw){
      try{
        const o=JSON.parse(raw);
        if(!o||typeof o!=='object'||(o.v!==2&&o.v!==1))throw new Error('format');
        if(old){delete o.rewards;delete o.cap}
        this.mem=cleanState(o);return this.mem;
      }catch(e){this.broken=true}
    }
    this.mem=defaultState();return this.mem;
  },
  save(quiet){
    if(!this.mem)return;
    if(!quiet)this.mem.ts=Date.now();
    try{window.localStorage.setItem(LS_KEY,JSON.stringify(this.mem))}catch(e){this.ok=false}
    if(!quiet&&this.onSave)this.onSave();
  },
  adopt(o){this.mem=cleanState(JSON.parse(JSON.stringify(o)));this.save(true);return this.mem},
  reset(owner){const keep=owner||'';this.mem=defaultState();this.mem.owner=keep;this.save();return this.mem}
};
/* richesse d'une sauvegarde : sert à choisir la plus avancée entre l'appareil et le compte */
function richness(S){
  const best=Object.keys(S.st||{}).reduce((a,k)=>a+((S.st[k]&&S.st[k].stars)||0),0);
  return best*1e6+(S.stars||0)*1e3+Math.min(999,(S.hist||[]).length);
}
function bestStars(S){return Object.keys(S.st).reduce((a,k)=>a+((S.st[k]&&S.st[k].stars)||0),0)}
function rankOf(S){const n=bestStars(S);let i=0;RANKS.forEach((r,k)=>{if(n>=r[1])i=k});return i}
/* ---------- Échelle de récompenses réelles ---------- */
const ladProg=S=>Math.max(0,S.crystals-S.ladBase);
function ladder(S){
  let cum=0,prevCum=0;const prog=ladProg(S);let nextSet=false;
  return S.lad.map((r,i)=>{prevCum=cum;cum+=r.cost;
    const st=r.got?'got':prog>=cum?'ready':'lock';
    const isNext=!nextSet&&st==='lock';if(isNext)nextSet=true;
    return{r,i,cum,prevCum,st,next:isNext,left:Math.max(0,cum-prog),pct:st==='lock'?Math.max(0,Math.min(1,(prog-prevCum)/r.cost)):1,mat:matOf(i)};});
}
const ladTotal=S=>S.lad.reduce((a,r)=>a+r.cost,0);
function pendIds(S){return ladder(S).filter(x=>x.st==='ready').map(x=>x.r.id)}
function giveReward(S,id){const r=S.lad.find(x=>x.id===id);if(r)r.got=true}
function restartLadder(S){S.lad.forEach(r=>{r.got=false});S.ladBase=S.crystals}

/* ---------- Stations : ouverture, étoiles (deux mondes : CE1 = niveau 1, CE2 = niveau 2) ---------- */
function chainOf(id){const s=STID[id];return STATIONS.filter(x=>x.sec===s.sec&&x.lv===s.lv)}
function starsOf(S,id){return (S.st[id]&&S.st[id].stars)||0}
function isOpen(S,id){
  if(S.open[id])return true;
  const s=STID[id],c=chainOf(id),i=c.findIndex(x=>x.id===id);
  if(i>0)return starsOf(S,c[i-1].id)>=1;
  if(s.lv===1)return true;
  return STATIONS.filter(x=>x.sec===s.sec&&x.lv===1&&!x.stretch).every(x=>starsOf(S,x.id)>=1);
}
function lockReason(S,id){
  const s=STID[id],c=chainOf(id),i=c.findIndex(x=>x.id===id);
  if(i>0)return 'Gagne une étoile à la mission « '+c[i-1].name+' ».';
  const miss=STATIONS.filter(x=>x.sec===s.sec&&x.lv===1&&!x.stretch&&starsOf(S,x.id)<1);
  if(!miss.length)return 'Cette mission est ouverte.';
  return 'Il te manque une étoile dans les Terres de départ : '+miss.map(x=>'« '+x.name+' »').join(', ')+'.';
}
function openSet(S){const o={};STATIONS.forEach(s=>{if(isOpen(S,s.id))o[s.id]=1});return o}
function starsFor(score){return score>=0.85?3:score>=0.65?2:score>=0.4?1:0}
function ensureDay(S){
  const t=dayStr();
  if(S.day!==t){S.day=t;S.todayC=0}
}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return dayStr(d)}

/* Recommandation : la station ouverte qui a le plus besoin de pratique */
function suggest(S){
  const t=dayStr(),dd=S.daily;
  if(dd&&dd.d===t&&STID[dd.id]&&isOpen(S,dd.id)&&starsOf(S,dd.id)<2)return STID[dd.id];
  const r=suggestPick(S);
  S.daily={d:t,id:r.id};
  return r;
}
function suggestPick(S){
  const open=STATIONS.filter(s=>isOpen(S,s.id)&&!s.stretch);
  const lastSec=S.hist.length?STID[S.hist[S.hist.length-1].st]&&STID[S.hist[S.hist.length-1].st].sec:null;
  let best=null,bs=-1;
  open.forEach(s=>{
    const st=S.st[s.id]||{};
    const stars=st.stars||0;
    let sc=(3-stars)*2;
    if(!st.runs)sc+=2.5;
    const rec=(st.recent||[]).slice(-1)[0];
    if(rec!==undefined&&rec<0.65)sc+=1.5;
    if(s.sec===lastSec)sc-=1.5;
    sc+=R.f()*0.8;
    if(sc>bs){bs=sc;best=s}
  });
  return best||STATIONS[0];
}

/* ---------- Réponses : 3 essais, astuces, réponse au dernier échec ---------- */
function check(q,resp){
  if(q.kind==='choice')return resp===q.ans;
  if(q.kind==='tap')return q.ans.indexOf(resp)>=0;
  if(q.kind==='build'){const ok=t=>Array.isArray(resp)&&resp.length===t.length&&resp.every((x,i)=>x===t[i]);return ok(q.target)||(q.alts||[]).some(ok)}
  return false;
}
/* Nombre d'essais : 3 au plus ; un choix à 2 réponses n'en a qu'un, à 3 réponses deux (le 3e serait gratuit) */
function maxAttempts(q,ses){
  if(ses.kind!=='mission')return 1;
  if(q.kind==='choice')return Math.max(1,Math.min(3,q.opts.length-1));
  if(q.kind==='tap'){const sel=q.tokens.filter(t=>!/^[.,!?;:]$/.test(t)).length;return Math.max(1,Math.min(3,sel-1))}
  return 3;
}
const PTS=[1,0.5,0.25];
function hasHint2(q,ses,tried){
  if(ses.kind!=='mission')return false;
  tried=tried||[];
  if(q.kind==='choice')return q.opts.filter(o=>o!==q.ans&&tried.indexOf(o)<0).length>=2;
  if(q.kind==='tap')return wrongTaps(q,tried).length>=3;
  return q.target.length>=3;
}
function wrongTaps(q,tried){return q.tokens.map((t,i)=>i).filter(i=>q.ans.indexOf(i)<0&&(tried||[]).indexOf(i)<0&&/[\p{L}\p{N}]/u.test(q.tokens[i]))}
/* Astuce de niveau 2 : on retire la moitié des mauvaises réponses, ou on pose le début de la phrase */
function makeHint2(q,tried){
  if(q.kind==='choice'){
    const w=q.opts.filter(o=>o!==q.ans&&tried.indexOf(o)<0);
    return {elim:shuf(w).slice(0,Math.floor(w.length/2))};
  }
  if(q.kind==='tap'){
    const w=wrongTaps(q,tried);
    return {dim:shuf(w).slice(0,Math.floor(w.length/2))};
  }
  return {lock:q.target.length<=5?1:2};
}
function newSession(kind,stId,qs){
  return {kind,st:stId,qs:qs.slice(),i:0,att:0,hl:0,early:false,h2:null,pts:[],fails:[],tried:[],done:false,correct:0,seen:0,startQ:qs.length,log:[]};
}
/* Valide une réponse. Retourne {ok, final, pts, retry, left} */
function submit(ses,resp){
  const q=ses.qs[ses.i];
  const ok=check(q,resp);
  ses.att++;
  if(ok){
    let pts=PTS[Math.min(ses.att,3)-1];
    if(ses.early)pts=Math.min(pts,0.5);
    if(q.rep)pts=0;
    return finalize(ses,q,pts,true);
  }
  if(ses.att>=maxAttempts(q,ses))return finalize(ses,q,0,false);
  return {ok:false,final:false,retry:true,left:maxAttempts(q,ses)-ses.att};
}
function finalize(ses,q,pts,ok){
  const res={ok,final:true,pts,q};
  ses.seen++;
  ses.log.push({st:q.st,ok,pts});
  if(ok)ses.correct++;
  if(!q.rep){ses.pts.push(pts)}
  ses.lastRes=res;
  if(!ok&&!q.rep&&ses.kind==='mission'){
    ses.fails.push(q);
    const at=Math.min(ses.i+4,ses.qs.length);
    ses.qs.splice(at,0,Object.assign({},q,{rep:true,opts:q.opts?shuf(q.opts):q.opts}));
  }
  ses.lastPts=pts;
  return res;
}
function advance(ses){
  ses.i++;ses.att=0;ses.hl=0;ses.early=false;ses.h2=null;ses.tried=[];ses.lastRes=null;
  if(ses.i>=ses.qs.length){ses.done=true}
  return !ses.done;
}

/* Suivi des compétences */
function recordSkill(S,q,pts){
  const k=q.key,sk=S.sk[k]||(S.sk[k]=[0,0]);
  if(pts>=1)sk[0]++;else if(pts>0){sk[0]++;sk[1]+=1-pts}else sk[1]++;
  if(sk[0]+sk[1]>40){sk[0]*=0.8;sk[1]*=0.8}
  if(pts<1){
    const e=S.err[k]||(S.err[k]={n:0,lab:q.lab||k,last:''});
    e.n+=pts===0?1:(1-pts);e.last=dayStr();e.lab=q.lab||e.lab;
  }else if(S.err[k]){
    S.err[k].n-=1;if(S.err[k].n<=0)delete S.err[k];
  }
}

/* Fin d'une mission : étoiles, cristaux, série, déblocages, grade, paliers gagnés */
function finishMission(S,ses){
  ensureDay(S);
  const id=ses.st,N=ses.startQ;
  const total=ses.pts.reduce((a,b)=>a+b,0);
  const score=N?total/N:0;
  const stars=starsFor(score);
  const before=openSet(S),rk0=rankOf(S),pend0=pendIds(S);
  const st=S.st[id]||(S.st[id]={stars:0,best:0,runs:0,recent:[],last:''});
  const prevStars=st.stars;
  st.runs++;st.recent.push(Math.round(score*100)/100);if(st.recent.length>6)st.recent.shift();
  st.best=Math.max(st.best,Math.round(score*100)/100);st.stars=Math.max(st.stars,stars);st.last=S.day;
  const after=openSet(S);
  const unlocked=STATIONS.filter(s=>after[s.id]&&!before[s.id]);
  const gainRaw=stars;
  const room=Math.max(0,S.cap-S.todayC);
  const gain=Math.min(gainRaw,room);
  S.todayC+=gain;S.crystals+=gain;S.stars+=stars;
  let bonus=0;
  if(S.lastDay!==S.day){
    S.streak=S.lastDay===yesterday()?S.streak+1:1;
    S.lastDay=S.day;
    if(S.streak%7===0&&S.bonusDay!==S.day){bonus=5;S.crystals+=5;S.bonusDay=S.day}
  }
  S.hist.push({d:S.day,st:id,s:Math.round(score*100),r:stars});
  if(S.hist.length>200)S.hist.splice(0,S.hist.length-200);
  const rk1=rankOf(S);
  const earned=ladder(S).filter(x=>x.st==='ready'&&pend0.indexOf(x.r.id)<0).map(x=>x.r);
  return {score,stars,gain,capped:gainRaw>gain,bonus,unlocked,prevStars,streak:S.streak,newBest:stars>prevStars,rankUp:rk1>rk0?rk1:-1,earned};
}

/* Test de départ (premier monde) */
function placementQuestions(){
  const out=[];
  SECTORS.forEach(sec=>{
    const sts=STATIONS.filter(s=>s.sec===sec.id&&s.lv===1);
    [1,2].forEach(i=>{
      if(!sts[i])return;
      const s=sts[i];
      let q=null;
      if(TXT[s.id]){const m=textMission(s.id,{});q=m[0]}
      else for(let k=0;k<20&&!q;k++){q=s.gen(2)}
      if(q){q.st=s.id;q.place=true;out.push(q)}
    });
  });
  return out;
}
function finishPlacement(S,ses){
  const byId={};
  ses.log.forEach(l=>{byId[l.st]=l.ok});
  SECTORS.forEach(sec=>{
    const sts=STATIONS.filter(s=>s.sec===sec.id&&s.lv===1);
    for(let i=1;i<sts.length;i++){
      if(byId[sts[i].id]===undefined)break;
      if(byId[sts[i].id]){S.open[sts[i].id]=true;if(i===1)S.open[sts[0].id]=true}
      else break;
    }
  });

}

/* Défi éclair */
function eclairQuestions(S,n){
  const open=STATIONS.filter(s=>isOpen(S,s.id)&&!TXT[s.id]&&s.gen);
  const out=[];const sigs=new Set();
  for(let k=0;k<n*8&&out.length<n;k++){
    const s=pick(open);
    const q=s.gen(pick([1,1,2]));
    if(!q||q.kind!=='choice')continue;
    q.st=s.id;
    const g=sig(q);if(sigs.has(g))continue;sigs.add(g);out.push(q);
  }
  return out;
}

/* ===== Sprites en pixels (SVG, nets) : créations originales ===== */
function PX(grid,pal,k,cls){
  const h=grid.length,w=grid[0].length,by={};
  grid.forEach((row,y)=>{
    let x=0;
    while(x<w){
      const c=row[x];
      if(c==='.'||!pal[c]){x++;continue}
      let e=x;while(e<w&&row[e]===c)e++;
      (by[c]||(by[c]=[])).push(`M${x} ${y}h${e-x}v1h${x-e}z`);
      x=e;
    }
  });
  const paths=Object.keys(by).map(c=>`<path d="${by[c].join('')}" style="fill:${pal[c]}"/>`).join('');
  const u=(k||0.25);
  return `<svg class="px${cls?' '+cls:''}" viewBox="0 0 ${w} ${h}" style="width:${w*u}rem;height:${h*u}rem" shape-rendering="crispEdges" aria-hidden="true" focusable="false">${paths}</svg>`;
}

  const L=ladder(S);

  L.forEach((x,i)=>{
