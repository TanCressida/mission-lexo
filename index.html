/* ---------- Lecture à voix haute ---------- */
function allTexts(){return D.t3.concat(D.t4,D.t5).map(t=>({id:t.id,t:t.t,words:t.p.join(' ').split(/\s+/).filter(Boolean).length,p:t.p}))}
function viewRead(){
  const r=A.read;
  if(!r||r.step==='pick'){
    const tx=allTexts().sort((a,b)=>a.words-b.words);
    return `<h1>Lecture à voix haute</h1><p>Choisis un texte. Lis-le à voix haute devant un adulte, sans te presser.</p><ul style="list-style:none;padding:0;display:grid;gap:.6rem">${tx.map(t=>`<li><button type="button" class="st" data-act="readgo" data-id="${t.id}"><span class="t"><b>${T(t.t)}</b><span>${t.words} mots</span></span></button></li>`).join('')}</ul>`;
  }
  const tx=allTexts().find(t=>t.id===r.id);
  if(r.step==='ready')return `<h1>${T(tx.t)}</h1><p>Prépare-toi. Quand tu appuies sur « Je commence », lis le texte en entier à voix haute.</p><div class="read" aria-label="Aperçu du texte">${tx.p.map(p=>`<p>${T(p)}</p>`).join('')}</div><div class="actions"><button type="button" class="btn gold" data-act="readstart">Je commence</button><button type="button" class="btn ghost" data-act="readpick">Choisir un autre texte</button></div>`;
  if(r.step==='go')return `<h1>${T(tx.t)}</h1><div class="read">${tx.p.map(p=>`<p>${T(p)}</p>`).join('')}</div><div class="actions"><button type="button" class="btn gold" data-act="readstop">J’ai fini de lire</button></div>`;
  return `<h1>Pour l’adulte</h1><section class="card"><p>Texte : ${T(tx.t)} (${tx.words} mots). Durée de lecture : ${Math.round(r.sec)} secondes.</p><form id="readform"><div class="field"><label for="re">Nombre de mots lus avec une erreur ou sautés</label><input type="number" id="re" name="re" min="0" max="${tx.words}" value="0" inputmode="numeric"></div><button class="btn gold" type="submit">Enregistrer</button></form></section>`;
}

/* ---------- Séance : affichage des questions ---------- */
let LES=null,NOPOP=false;
function askQuit(){
  const ses=A.ses;
  if(!LES||$('[data-act=stay]'))return;
  if(ses&&ses.i>0&&!ses.done){
    const w=LES.querySelector('.wrap');if(w){w.inert=true;w.setAttribute('aria-hidden','true')}
    LES.insertAdjacentHTML('beforeend',`<div class="wrap"><div class="card" role="alertdialog" aria-labelledby="qq"><h2 id="qq">Quitter la mission ?</h2><p>Ta progression de cette mission ne sera pas gardée.</p><div class="row"><button type="button" class="btn gold" data-act="stay">Continuer la mission</button><button type="button" class="btn ghost" data-act="done">Quitter</button></div></div></div>`);
    const g=$('[data-act=stay]');if(g)g.focus();
  }else closeLesson();
}
window.addEventListener('popstate',()=>{
  if(NOPOP){NOPOP=false;return}
  if(LES){try{history.pushState({lex:1},'')}catch(e){}askQuit()}
});
function openLesson(){
  const ae=document.activeElement;
  A.opener=ae&&ae.dataset&&ae.dataset.act?`[data-act="${ae.dataset.act}"]${ae.dataset.st?`[data-st="${ae.dataset.st}"]`:''}${ae.dataset.view?`[data-view="${ae.dataset.view}"]`:''}`:null;
  LES=document.createElement('div');
  LES.className='lesson';LES.id='lesson';
  LES.setAttribute('role','dialog');LES.setAttribute('aria-modal','true');LES.setAttribute('aria-labelledby','lt');
  document.body.appendChild(LES);
  try{history.pushState({lex:1},'')}catch(e){}
  lockBackground(true);
  document.body.style.overflow='hidden';
}
function closeLesson(fromPop){
  if(LES){LES.remove();LES=null;if(!fromPop){try{if(history.state&&history.state.lex){NOPOP=true;history.back()}}catch(e){}}}
  lockBackground(false);
  document.body.style.overflow='';
  Voice.stop();
  A.ses=null;
  if(!A.auth)render(true);
  let o=null;
  if(A.opener){try{o=$(A.opener)}catch(e){o=null}}
  if(!o){o=$('#view h1');if(o)o.setAttribute('tabindex','-1')}
  if(o)o.focus();
}
function sessionTitle(ses){
  if(ses.kind==='eclair')return 'Défi éclair';
  if(ses.kind==='place')return 'Test de départ';
  return STID[ses.st].name;
}
function ctxHTML(q){
  if(!q.text)return '';
  let h=esc(typo(q.text));
  h=h.replace(/___/g,'<span class="gap" role="img" aria-label="mot manquant">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  if(q.markAt){
    const t=typo(q.text);
    if(q.markAt[0]>=0&&q.markAt[1]<=q.text.length&&q.markAt[1]>q.markAt[0]){
      const a=esc(typo(q.text.slice(0,q.markAt[0]))),m=esc(typo(q.text.slice(q.markAt[0],q.markAt[1]))),b=esc(typo(q.text.slice(q.markAt[1])));
      h=(a+'<mark>'+m+'</mark>'+b).replace(/___/g,'<span class="gap" role="img" aria-label="mot manquant">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    }
  }else if(q.mark){const m=esc(typo(q.mark));h=h.replace(m,`<mark>${m}</mark>`)}
  return `<p class="ctx" id="ctx">${h}</p>`;
}
function progHTML(ses){
  const n=ses.qs.length;
  let h='';for(let i=0;i<n;i++)h+=`<i class="${i<ses.i?'d':''}${i===ses.i?' c':''}"></i>`;
  return `<div class="prog" role="img" aria-label="Question ${ses.i+1} sur ${n}">${h}</div>`;
}
function pipsHTML(ses,q,done){
  const m=maxAttempts(q,ses);
  if(m<2)return done?'<p class="pips" id="pips"><span>Un seul essai</span></p>':'<p class="pips" id="pips"><span>Un seul essai pour cette question</span></p>';
  const left=done?0:m-ses.att;
  let p='';for(let i=0;i<m;i++)p+=`<i class="${i<left?'':'u'}"></i>`;
  return `<p class="pips" id="pips"><span aria-hidden="true">${p}</span><span>${left} essai${left>1?'s':''}</span></p>`;
}
function renderQuestion(){
  const ses=A.ses,q=ses.qs[ses.i];
  const showHint=ses.kind==='mission';
  let body='';
  if(q.paras){
    body+=`<section class="passage" aria-labelledby="pt"><h2 id="pt" style="font-size:1.1rem">${T(q.title)}</h2>${q.paras.map(p=>`<p>${T(p)}</p>`).join('')}</section>`;
  }

  A.sel=[];
  const lead=`<h2 class="lead" id="lead" tabindex="-1"><span class="sr">Question ${ses.i+1} sur ${ses.qs.length}${q.rep?', on la revoit' : ''}. </span>${T(q.lead)}</h2>${q.sub?`<p class="sub">${T(q.sub)}</p>`:''}`;

    ans=`<fieldset><legend class="sr">Choisis une réponse</legend><div class="opts">${q.opts.map((o,i)=>`<label class="opt"><input type="radio" name="r" value="${esc(o)}"><span>${T(o)}<span class="mk sr"></span></span></label>`).join('')}</div></fieldset>`;
  }else if(q.kind==='tap'){
    ans=`<fieldset><legend class="sr">Touche un mot</legend><div class="chips2">${q.tokens.map((t,i)=>`<label class="chip2"><input type="radio" name="r" value="${i}" aria-label="${esc(PUNC[t]||t)}"${PUNC[t]?' disabled':''}><span aria-hidden="true">${T(t)}</span></label>`).join('')}</div></fieldset>`;
  }else{
    const long=q.join==='\n';
    ans=`<p class="sub" id="bl">${long?'Phrases disponibles':'Éléments disponibles'}</p><div class="tiles" role="group" aria-labelledby="bl">${q.tokens.map((t,i)=>`<button type="button" class="tile${long?' long':''}" data-act="tile" data-i="${i}" aria-disabled="false">${T(t)}</button>`).join('')}</div>
    <p class="sub" id="al">Ta réponse</p><ol class="answerline${long?' long':''}" id="aline" aria-labelledby="al"><li class="ph">Vide pour l’instant</li></ol>
    <div class="row"><button type="button" class="btn ghost small" data-act="undo">Effacer le dernier</button><button type="button" class="btn ghost small" data-act="clear">Tout effacer</button></div>`;
  }
  const listen=Voice.ok?`<button type="button" class="btn ghost small" data-act="listen">${sprIc('speaker',.2)} Écouter</button>`:'';
  const hintBtn=showHint&&q.hint?`<button type="button" class="btn ghost small" data-act="hint" aria-expanded="false" aria-controls="hintbox">${sprIc('bulb',.2)} Astuce</button>`:'';

   <form class="qcard" id="qf" novalidate>${showHint?pipsHTML(ses,q):''}${body}${lead}${ans}<div id="hintbox" class="hintbox" hidden></div>

function getResp(q){
  const f=$('#qf');

  if(q.kind==='tap'){const c=$('input[name=r]:checked',f);return c?parseInt(c.value,10):null}

const GOOD=['Bravo !','Bien joué !','Exact !','Super !','Oui, c’est ça !'];
function answerText(q){
  if(q.kind==='choice')return q.ans;
  if(q.kind==='tap')return q.ans.map(i=>q.tokens[i]).filter((v,i,a)=>a.indexOf(v)===i).join(' ou ');
  return q.target.join(q.join==='\n'?' ':q.join).replace(/ ([.,!?;:])/g,'$1').replace(/' /g,'’');
}
/* ----- Astuces : niveau 1 = texte de la question, niveau 2 = aide concrète ----- */
function hintMax(){const ses=A.ses,q=ses.qs[ses.i];return (q.hint?1:0)+(q.hint&&hasHint2(q,ses,ses.tried)?1:0)}
function renderHint(){
  const ses=A.ses,q=ses.qs[ses.i],hb=$('#hintbox');
  if(!hb)return;
  if(!ses.hl){hb.hidden=true;hb.innerHTML='';return}
  let l2='';
  if(ses.hl>=2&&ses.h2){
    if(q.kind==='choice')l2=`J’ai barré ${ses.h2.elim.length} mauvaise${ses.h2.elim.length>1?'s':''} réponse${ses.h2.elim.length>1?'s':''} pour toi.`;
    else if(q.kind==='tap')l2='J’ai barré quelques mots qui ne conviennent pas.';
    else l2=ses.h2.lock>1?'J’ai posé le début de la phrase pour toi.':'J’ai posé le premier mot pour toi.';
  }
  hb.hidden=false;
  hb.innerHTML=`${owlSpr('happy',.2)}<div><p><b>Astuce de Plume.</b> ${T(q.hint)}</p>${l2?`<p>${T(l2)}</p>`:''}</div>`;
  const b=$('[data-act=hint]');
  if(b){b.setAttribute('aria-expanded','true');if(ses.hl>=hintMax())b.setAttribute('aria-disabled','true');else b.removeAttribute('aria-disabled')}
  announce('Astuce : '+typo(q.hint)+(l2?' '+l2:''));
}
function applyHint2(q){
  const ses=A.ses,h=ses.h2;if(!h)return;
  const f=$('#qf');
  if(q.kind==='choice'){
    $$('input[name=r]',f).forEach(i=>{
      if(h.elim.indexOf(i.value)>=0){i.checked=false;i.disabled=true;i.parentNode.classList.add('out');const mk=$('.mk',i.parentNode);if(mk){mk.textContent=' (barrée)';mk.classList.remove('sr')}}
    });
  }else if(q.kind==='tap'){
    $$('input[name=r]',f).forEach(i=>{
      if(h.dim.indexOf(parseInt(i.value,10))>=0){i.checked=false;i.disabled=true;i.parentNode.classList.add('out')}
    });
  }else{
    const used=new Set(A.sel);
    for(let j=A.sel.length;j<h.lock;j++){
      const idx=q.tokens.findIndex((t,i)=>t===q.target[j]&&!used.has(i));
      if(idx>=0){A.sel.push(idx);used.add(idx)}
    }
    ses.lock=Math.max(ses.lock||0,A.sel.length);
    refreshBuild();
  }
}
function bumpHint(manual){
  const ses=A.ses,q=ses.qs[ses.i];
  if(ses.hl>=hintMax()){if(manual)announce('Il n’y a plus d’astuce pour cette question.');return false}
  ses.hl++;
  if(manual&&ses.att===0)ses.early=true;
  if(ses.hl===2){ses.h2=makeHint2(q,ses.tried);applyHint2(q)}
  renderHint();
  return true;
}
function showFeedback(res,q){

    Snd.play('ok');

function disableAnswers(q,final){
  const f=$('#qf');
  if(final&&q.kind==='choice')$$('.gap',f).forEach(g=>{g.textContent=typo(q.ans);g.classList.add('f');g.removeAttribute('role');g.removeAttribute('aria-label')});

}
function onSubmit(e){
  e.preventDefault();

  const q=ses.qs[ses.i];
  if(ses.lastRes&&ses.lastRes.final){nextQuestion();return}
  const resp=getResp(q);
  if(resp===null||(q.kind==='build'&&resp.length<q.target.length)){
    const fb=$('#fb');
    fb.innerHTML=`<div class="fb soft">${owlSpr('oops',.22)}<div><b>${q.kind==='build'?'Ta réponse n’est pas finie.':'Choisis une réponse d’abord.'}</b></div></div>`;
    if(q.kind==='choice'||q.kind==='tap'){const f=$('input[name=r]:not(:disabled)');if(f)f.focus()}
    return;
  }
  const res=submit(ses,resp);
  if(res.final){
    showFeedback(res,q);
    {const p=$('#pips');if(p&&!res.ok)p.outerHTML=pipsHTML(ses,q,true)}
    if(ses.kind==='mission')recordSkill(S,q,q.rep?(res.ok?0.5:0):res.pts);
    save();
    disableAnswers(q,true);
    const go=$('#go');

    go.type='button';go.dataset.act='next';

  }else{
    ses.tried.push(q.kind==='build'?'b':resp);

      const c=$('input[name=r]:checked');
      if(c){c.checked=false;c.disabled=true;const mk=$('.mk',c.parentNode);if(mk){mk.textContent=' (déjà essayé)';mk.classList.remove('sr')}}
    }else{
      A.sel=A.sel.slice(0,ses.lock||0);refreshBuild();
    }
    const p=$('#pips');if(p)p.outerHTML=pipsHTML(ses,q);
    bumpHint(false);
    showFeedback(res,q);
    if(q.kind==='build'){const t=$('.tile:not([aria-disabled=true])');if(t)t.focus()}
    else{const nx=$('input[name=r]:not(:disabled)');if(nx)nx.focus()}
  }
}

function pinKey(k){
  if(Date.now()<A.lockUntil){A.msg='Trop d’essais. Attends quelques secondes.';A.pinBuf='';render(true);announce(A.msg);return}
  if(k==='del')A.pinBuf=A.pinBuf.slice(0,-1);
  else if(A.pinBuf.length<4)A.pinBuf+=k;
  A.msg='';
  if(A.pinBuf.length===4){
    if(!S.pin){
      if(A.pinStep===0){A.pinTmp=A.pinBuf;A.pinBuf='';A.pinStep=1}
      else if(A.pinBuf===A.pinTmp){S.pin=A.pinBuf;save();A.pinOK=true;A.pinBuf='';A.pinStep=0;A.pinTmp=''}
      else{A.msg='Les deux codes sont différents. Recommence.';A.pinBuf='';A.pinStep=0;A.pinTmp=''}
    }else if(A.pinBuf===S.pin){A.pinOK=true;A.pinBuf='';A.fails=0}
    else{A.fails++;A.msg='Code incorrect.';A.pinBuf='';if(A.fails>=5){A.lockUntil=Date.now()+30000;A.fails=0;A.msg='Code incorrect. Pause de 30 secondes.'}}
  }

  if(A.msg){announce(A.msg)}

}

  }
  if(f.id==='readform'){
    const r=A.read,tx=allTexts().find(t=>t.id===r.id),er=Math.max(0,Math.min(tx.words,parseInt(f.re.value,10)||0));
    const wcpm=Math.max(0,Math.round((tx.words-er)/(r.sec/60)));
    ensureDay(S);S.flu.push({d:S.day,t:tx.t,id:tx.id,wcpm,e:er});if(S.flu.length>60)S.flu.shift();save();
    A.read={step:'pick'};A.view='defis';render();announce('Lecture enregistrée : '+wcpm+' mots par minute.');
  }
});
document.addEventListener('change',e=>{
  const f=e.target.form;
  if(f&&f.id==='pf'){
    const n=e.target.name,p=S.prefs;
    if(e.target.type==='checkbox')p[n]=e.target.checked;
    else p[n]=n==='size'?parseInt(e.target.value,10):e.target.value;
    save();applyPrefs();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&LES){
    const st=$('[data-act=stay]',LES);
    if(st){e.preventDefault();st.click();return}
    const q=$('[data-act=quit]',LES);if(q){e.preventDefault();q.click()}
  }
  if(e.key==='Tab'&&LES){
    const f=$$('button:not([disabled]),input:not([disabled]),[tabindex="0"],[href]',LES).filter(x=>x.offsetParent!==null||x===document.activeElement);
    if(!f.length)return;
    const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===a||!LES.contains(document.activeElement))){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&(document.activeElement===z||!LES.contains(document.activeElement))){e.preventDefault();a.focus()}
  }
});

function boot(){
  S=Store.load();
  Store.onSave=schedulePush;
  authLoad();
  applyPrefs();
  Voice.init();
  const lg=$('#logo');if(lg)lg.innerHTML=owlSpr('happy',.15);
  A.view='map';
  window.__lexo={S:()=>S,A,render,startMission,buildMission,STATIONS,isOpen,Store,submit:(r)=>submit(A.ses,r),AUTH:()=>AUTH};
  if(GATED&&!AUTH){showAuth();return}
  if(AUTH){
    if(S.owner&&S.owner!==AUTH.uid){S=Store.reset(AUTH.uid);applyPrefs()}
    S.owner=AUTH.uid;Store.save(true);
  }
  render(true);
  if(AUTH)sbSync(false);
}
document.addEventListener('DOMContentLoaded',boot);

</script>
